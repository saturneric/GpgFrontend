#
# The stable releases, mirrored to GitHub Releases (app/github_sync.py).
#
# A stable release reaches users through the signed update index, which the
# signing host publishes once the maintainer has signed the release offline.
# Every hour this reads that index from the public HTTPS bases, as the
# application does, and makes each stable release's GitHub release what the
# index says: the files with their maintainer signatures, and the signed
# release notes. Every file is checked against the index and its signature
# before it is uploaded, so nothing here rests on this runner; the job's
# token only writes this repository's releases.
#
# By hand: run it with a version to mirror only that release, or as a dry
# run to see the planned steps without writing anything.

name: GitHub Release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: "Only these releases (X.Y.Z, space-separated); empty: every stable one"
        required: false
        default: ""
      dry_run:
        description: "Check and plan only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

env:
  # The first trust root, as the signing host pins it: every later root is
  # taken only on its predecessor's signatures.
  GFR_ROOT_SHA256: 974990b7123799de23ad47742117e5a1d30b8485ae8b88a22781a0d1863248b1

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          lfs: "false"
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            release

      - name: Mirror the stable releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.versions }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          read -ra args <<< "${ONLY}"
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          python3 -I scripts/release/gfrelease github sync \
            --repository "${GITHUB_REPOSITORY}" "${args[@]}"
