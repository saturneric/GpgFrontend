#
# Layout
# ------
#   setup           checks the pipeline itself, decides the build mode once
#   build-linux     AppImage, x86_64 and aarch64, installed and portable
#   build-windows   MSI (installed) and ZIP (portable)
#   build-android   unsigned APK and AAB  -> sign-android -> play-upload
#   build-macos     unsigned bundle       -> sign-macos   -> macos-smoke
#   provenance      signs the release candidate after every platform check
#   release         verifies it and publishes the nightly
#
# The work itself lives in scripts/ci/<platform>/, where each step's
# rationale sits beside its code. A job here only says what runs, in which
# order, with which inputs.
#
# macOS trust boundary
# --------------------
# The macOS pipeline is split in two on purpose. `build-macos` compiles and
# deploys the bundle and never sees a secret; `sign-macos` holds the Apple
# credentials and runs nothing but Apple's own tools on the finished bundle.
# That keeps the Developer ID private key off any runner that also executes
# build-time code -- submodules, cargo build scripts, brew formulas and
# third-party build actions.
#
# `build-macos` is treated as potentially compromised, so everything it hands
# over is untrusted bytes. `sign-macos` may unpack, inspect and sign that
# payload; it must never source, evaluate, execute, or take configuration or
# signing policy from it. Signing identity, entitlement policy, signing order
# and acceptance checks all live in this file, not in the artifact.
#
# What this does NOT do is establish provenance: a compromised build job can
# still present a malicious payload that the signing job faithfully signs.
# Isolating the key is the goal here; attestation is a separate problem.
#
# `sign-macos` reads these from the `macos-signing` GitHub environment:
#   DEVELOP_ID_CERT                  base64 of the Developer ID .p12
#   DEVELOP_ID_CERT_PWD              its export password
#   DEVELOPER_ID_CODE_SIGN_IDENTITY  the identity string codesign selects
#   ASC_API_KEY_P8                   contents of the App Store Connect .p8
#   ASC_KEY_ID / ASC_ISSUER_ID       its key id and issuer uuid
# Once this flow is verified, these repository secrets can be deleted:
#   APPLE_DEVELOPER_ID, APPLE_DEVELOPER_TEAM_ID, APPLE_DEVELOPER_ID_SECRET
#     -- replaced by the App Store Connect API key above;
#   DEVELOPER_ID_PROVISIONING_PROFILE_DATA, DEVELOPER_ID_PROVISIONING_PROFILE_UUID
#     -- the Developer ID entitlements are hardened-runtime exceptions only and
#        need no provisioning profile.
# GPGFRONTEND_XCODE_TEAM_ID and the MAS_* secrets stay: mas-sandbox.yml uses them.

name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - release
      # A Windows portable build with the hidden --screenshot mode compiled in,
      # for rendering the user manual's images. Never a release: setup refuses
      # it together with build_mode=release, and CMake refuses it together
      # with a stable build.
      screenshot:
        description: "Build the screenshot-mode binary (Windows portable only)"
        required: false
        default: false
        type: boolean

# Supersede in-flight work: a new commit on a ref makes the run already going
# for that ref obsolete. Grouping by ref keeps each PR, main, and each v* tag
# in its own lane, so a tag build is never cancelled by unrelated activity.
# A screenshot build has a lane of its own beside its ref's: it is a tool for
# the manual, not a newer nightly or release, so it neither cancels nor is
# cancelled by one; a newer screenshot dispatch still supersedes an older one.
# Cancelling a run mid-signing is safe: the signing cleanup steps are
# `if: always()`, which still fires on cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.screenshot && '-screenshot' || '' }}
  cancel-in-progress: true

# Least privilege by default; only the release job is granted contents: write.
permissions:
  contents: read

env:
  GNUPG_VERSION: "2.5.24"

jobs:
  # Cheap checks of the pipeline itself, before any runner compiles anything:
  # the failures they catch otherwise cost a full matrix. And the build mode,
  # decided once here and handed to every build job as job outputs.
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.mode.outputs.short_sha }}
      build_type: ${{ steps.mode.outputs.build_type }}
      gpgfrontend_build_mode: ${{ steps.mode.outputs.gpgfrontend_build_mode }}
      screenshot_cmake_flag: ${{ steps.mode.outputs.screenshot_cmake_flag }}
      macos_runners: ${{ steps.mode.outputs.macos_runners }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"

      # Every `run:` block is its own process. A variable set in one step is
      # gone by the next, and neither shell says so usefully: bash under
      # `set -u` at least aborts, while PowerShell expands an undefined
      # variable to the EMPTY STRING -- which once turned `--expect-count
      # "$EXPECTED"` into a gate expecting nothing.
      - name: Check Workflow Steps Define What They Read
        run: python3 scripts/check_workflow_steps.py

      # The release-candidate rules, and the workflow structure they rely on.
      # Here so a pull request runs them: provenance and release only run on
      # main, where a failure costs a nightly.
      - name: Test Release Candidate Rules
        run: python3 -m unittest discover -s scripts/tests

      - name: Resolve Build Mode
        id: mode
        env:
          BUILD_MODE_INPUT: ${{ github.event.inputs.build_mode }}
          SCREENSHOT_INPUT: ${{ inputs.screenshot }}
        run: |
          set -euo pipefail
          scripts/ci/build_mode.sh >> "$GITHUB_OUTPUT"
          # The macOS legs, named once: build-macos, sign-macos and
          # macos-smoke must run the same list. macOS ships only the installed
          # flavour: the app is a notarized bundle in /Applications, so a
          # portable layout has no meaning there.
          echo 'macos_runners=["macos-15-intel", "macos-15", "macos-26-intel", "macos-26"]' >> "$GITHUB_OUTPUT"

  # One leg's failure does not cancel the others (fail-fast: false) in any
  # build matrix: a cancelled leg hides whether it would have failed too. The
  # release still needs every leg to succeed, which `needs:` in provenance
  # enforces; there is no continue-on-error anywhere.
  #
  # Portable vs installed is a compile-time decision (GPGFRONTEND_BUILD_FLAVOR
  # decides where the profile, and with it the user's keys, lives), so each
  # flavour needs its own configure and build. They run as separate legs on
  # purpose: the generated build headers land in the source tree, so two
  # flavours cannot share one checkout.
  #
  # Every leg uploads exactly `gpgfrontend-<leg>` and `buildinfo-<leg>`, with
  # the same <leg>. That exact name is how provenance pairs them, so a new leg
  # needs nothing else from the release path. Build info is a separate
  # artifact so the deliverable artifact stays flat.
  build-linux:
    needs: setup
    # A screenshot build is one Windows portable leg and nothing else.
    if: ${{ !inputs.screenshot }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04-arm"]
        flavor: ["installed", "portable"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Lets ccache cache every translation unit that force-includes the CMake
      # PCH, and the .gch itself. Without these they were all "uncacheable"
      # -- 493 of 824 compiler calls on Linux -- so even a warm cache rebuilt
      # core, ui and test in full. Only timestamp and __DATE__-style checks
      # are relaxed; what is hashed into an object is unchanged.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
      GPGFRONTEND_BUILD_MODE: ${{ needs.setup.outputs.gpgfrontend_build_mode }}
      SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
      FLAVOR: ${{ matrix.flavor }}
      # "installed" is the default flavour, so only "portable" is spelled out
      # in artifact names.
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'portable' && '-portable' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          submodules: recursive

      # One compiler cache per runner, shared by both flavours: the portable
      # flag reaches a single translation unit (BuildInfoUtils.cpp), not the
      # PCH, so the two builds are otherwise object-for-object identical. The
      # installed leg is the only writer; the portable leg only reads it.
      # Nothing is saved from pull requests, so a cache main restores can only
      # have been written by a push to it. The key keeps the `build-` prefix
      # these legs had as one job, so the split costs no cold build.
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: build-${{ matrix.os }}-installed-${{ env.BUILD_TYPE }}
          # A limit, not a size: ccache caps each of its 16 subdirectories at
          # 1/16 of this, and a compressed .gch runs past 100 MB -- at 1500M
          # every PCH result was evicted as it was stored.
          max-size: 4G
          save: ${{ github.event_name == 'push' && matrix.flavor == 'installed' }}

      # Everything compiled from here on touches the cache entries it uses, so
      # "older than this mark" is exactly "not used by this build". The build
      # script evicts those before the post step saves the cache.
      - name: Mark ccache Epoch
        run: echo "CCACHE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Dependence
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential binutils git autoconf automake gettext texinfo
          sudo apt-get -y install gcc g++ ninja-build
          sudo apt-get -y install libarchive-dev libssl-dev libsodium-dev
          sudo apt-get -y install gpgsm libxcb-xinerama0 libxcb-icccm4-dev libcups2-dev libdrm-dev libegl1-mesa-dev
          sudo apt-get -y install libfuse2 libgcrypt20-dev libnss3-dev libpci-dev libpulse-dev libudev-dev libxtst-dev
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-image0 gyp
          sudo apt-get -y install libxcb-* libxkbcommon-x11-0 libwayland-cursor0 libwayland-egl1
          # libsecret is dlopen'd, never linked. Installed only so the AppImage
          # can carry a copy built against the same glib it bundles.
          sudo apt-get -y install libsecret-1-0

      - name: Install Qt6
        uses: ./.github/actions/install-qt6

      - name: Install Rust
        id: rust
        # Pinned to a SHA, so the @stable ref name no longer selects the
        # toolchain; say it explicitly instead.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      # Corrosion's target dir, restored whole. rust-cache is not used: cargo
      # builds with --target <triple>, and rust-cache's cleaner took
      # <target-dir>/<triple> for a profile directory and deleted release/
      # inside it, so every leg compiled all ~196 crates from nothing while
      # reporting an exact cache hit.
      #
      # The key is everything that decides the dependency artifacts: the
      # runner, the exact rustc, the profile and Cargo.lock. Both flavours
      # share it -- the crate never sees the portable flag -- and the
      # installed leg alone saves it, right after a successful build.
      - name: Restore Cargo Cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/cargo
          key: cargo-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.BUILD_TYPE }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.BUILD_TYPE }}-

      - name: Build GpgFrontend
        run: scripts/ci/linux/build.sh

      - name: Save Cargo Cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
        if: >-
          github.event_name == 'push' && matrix.flavor == 'installed' &&
          steps.cargo-cache.outputs.cache-hit != 'true'

      - name: Package The AppImage
        run: scripts/ci/linux/package.sh

      - name: Smoke Test The AppImage
        run: scripts/ci/linux/smoke_appimage.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpgfrontend-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ github.workspace }}/build/upload-artifact/GpgFrontend-*.AppImage*
          if-no-files-found: error

      - name: Upload Build Info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildinfo-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ github.workspace }}/build/artifacts/build-info.json
          if-no-files-found: error

  build-windows:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022"]
        # A screenshot build is this one portable leg; every other run gets
        # both flavours.
        flavor: ${{ fromJSON(inputs.screenshot && '["portable"]' || '["installed", "portable"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    env:
      # See build-linux.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
      GPGFRONTEND_BUILD_MODE: ${{ needs.setup.outputs.gpgfrontend_build_mode }}
      SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
      SCREENSHOT_CMAKE_FLAG: ${{ needs.setup.outputs.screenshot_cmake_flag }}
      FLAVOR: ${{ matrix.flavor }}
    steps:
      # Before checkout, and before MSYS2 exists: plain bash.
      - name: Set git to use LF line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          submodules: recursive

      # See build-linux: one cache per runner, written by the installed leg.
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: build-${{ matrix.os }}-installed-${{ env.BUILD_TYPE }}
          max-size: 4G
          save: ${{ github.event_name == 'push' && matrix.flavor == 'installed' }}

      - name: Mark ccache Epoch
        shell: bash
        run: echo "CCACHE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up MinGW
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          update: false
          release: false
          cache: true
          install: >-
            git
            zip
            unzip
            msys2-devel
            base-devel
            msys2-runtime-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-libassuan
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-openssl

      # Windows builds with msys2's own rustc, which moves with the msys2
      # package set rather than with rustup.
      - name: Rust Toolchain Key
        id: rustwin
        run: echo "cachekey=$(rustc -vV | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # See build-linux.
      - name: Restore Cargo Cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/cargo
          key: cargo-${{ matrix.os }}-${{ steps.rustwin.outputs.cachekey }}-${{ env.BUILD_TYPE }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ steps.rustwin.outputs.cachekey }}-${{ env.BUILD_TYPE }}-

      - name: Build GpgME And GpgFrontend
        env:
          # ccache takes MinGW's `c++.exe` for an unknown compiler and then
          # applies clang's PCH rule: refuse a cached .gch whose headers have
          # a new mtime. CMake rewrites cmake_pch.hxx at every configure, so
          # every PCH and its ~480 users missed on every run. It is gcc.
          CCACHE_COMPILERTYPE: gcc
        run: |
          "$(cygpath -u "$GITHUB_WORKSPACE")/scripts/ci/windows/build.sh"

      - name: Save Cargo Cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
        if: >-
          github.event_name == 'push' && matrix.flavor == 'installed' &&
          steps.cargo-cache.outputs.cache-hit != 'true'

      - name: Download GnuPG Binary Release
        run: |
          "$(cygpath -u "$GITHUB_WORKSPACE")/scripts/ci/windows/fetch_gnupg.sh"

      - name: Package The Payload
        run: |
          "$(cygpath -u "$GITHUB_WORKSPACE")/scripts/ci/windows/package.sh"

      - name: Package Portable Archive
        if: matrix.flavor == 'portable'
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/build/artifacts"
          zip -r "../upload-artifact/GpgFrontend-${SHORT_SHA}-windows-x86_64-portable.zip" *

      - name: Build MSI Installer
        if: matrix.flavor == 'installed'
        shell: pwsh
        run: |
          ./scripts/ci/windows/build_msi.ps1 -OutputName "GpgFrontend-$env:SHORT_SHA-windows-x86_64.msi"

      - name: Smoke Test The Portable Archive
        if: matrix.flavor == 'portable'
        run: |
          "$(cygpath -u "$GITHUB_WORKSPACE")/scripts/ci/windows/smoke_portable.sh"

      # Nothing is checked here: a hosted runner is not the environment the
      # manual's images are rendered in, so the screenshot mode is exercised
      # on the reference workstation only. The build records just the commit
      # the pipeline compares against.
      - name: Record Screenshot Build Info
        if: matrix.flavor == 'portable' && inputs.screenshot
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          printf '{\n  "schema": 1,\n  "commit": "%s"\n}\n' "${GITHUB_SHA}" \
            >build/upload-artifact/BUILD-INFO.json
          cat build/upload-artifact/BUILD-INFO.json

      - name: Upload Artifact
        if: ${{ !inputs.screenshot }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpgfrontend-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ github.workspace }}/build/upload-artifact/*
          if-no-files-found: error

      # A screenshot build is a tool for the manual, not a deliverable: named
      # outside the release's patterns, kept two weeks, and with its
      # BUILD-INFO.json (the commit) inside.
      - name: Upload Screenshot Build
        if: inputs.screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ github.workspace }}/build/upload-artifact/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Info
        if: ${{ !inputs.screenshot }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildinfo-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ github.workspace }}/build/artifacts/build-info.json
          if-no-files-found: error

  # The Android application, cross-built with the toolchain it is released
  # with: Qt 6.10.3 for Android (the oldest open-source Qt whose Android
  # libraries are 16 KB-page aligned and target API 36), NDK r27c and JDK 17,
  # as Qt 6.10 documents. The SDK and JDK are the runner image's own; the NDK
  # is installed at the exact version and Qt with the pinned install-qt-action
  # the desktop jobs use.
  #
  # Like build-macos, it holds no secrets: the APK and the app bundle (AAB)
  # leave here unsigned, after the checks that need the build tree, and are
  # signed by sign-android below; play-upload signs the arm64-v8a bundle again
  # with the Play upload key.
  build-android:
    # Named by the ABI alone: by default every matrix value is listed.
    name: build-android (${{ matrix.arch }})
    if: ${{ !inputs.screenshot }}
    strategy:
      # One ABI failing does not cancel the other, as in build-macos.
      fail-fast: false
      matrix:
        include:
          # One APK and one AAB per ABI: ARM for phones, x86_64 for
          # emulators and Chromebooks. `arch` names the files, and on Android
          # that is the ABI's own name, as phones and app stores show it.
          - arch: arm64-v8a
            abi: arm64-v8a
            qt_arch: android_arm64_v8a
            rust_target: aarch64-linux-android
          - arch: x86_64
            abi: x86_64
            qt_arch: android_x86_64
            rust_target: x86_64-linux-android
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GF_ANDROID_QT: "6.10.3"
      GF_ANDROID_NDK: "27.2.12479018"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          submodules: recursive

      - name: Install Android Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf automake libtool
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${GF_ANDROID_NDK}" "platforms;android-36" "build-tools;36.0.0"

      # The action the desktop jobs use (.github/actions/install-qt6), called
      # directly because Android stays on its own Qt version. Qt for Android is
      # published under the all_os host since Qt 6.7; aqt then also installs
      # the Linux desktop Qt a cross build needs (QT_HOST_PATH), which the
      # action always asks for.
      - name: Install Qt6 For Android
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.GF_ANDROID_QT }}
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          dir: ${{ runner.temp }}
          cache: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build The APK And AAB
        env:
          QT_ARCH: ${{ matrix.qt_arch }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          ndk="$ANDROID_HOME/ndk/$GF_ANDROID_NDK"
          qt="$RUNNER_TEMP/Qt/$GF_ANDROID_QT"
          "$qt/$QT_ARCH/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGPGFRONTEND_BUILD_FLAVOR=android \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" -DANDROID_NDK_ROOT="$ndk" \
            -DQT_HOST_PATH="$qt/gcc_64"
          cmake --build build --parallel
          cmake --build build --target apk
          cmake --build build --target aab

      - name: Check The Libraries
        run: |
          set -euo pipefail
          bin="$ANDROID_HOME/ndk/$GF_ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NM="$bin/llvm-nm" READELF="$bin/llvm-readelf" \
            scripts/check_no_gpgme.sh build

      # What signing cannot change, checked here where the build tree and the
      # scripts are: the package, its API level, and every native library 16
      # KB aligned (apksigner signs without moving entries).
      - name: Check The APK
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          apk="build/artifacts/GpgFrontend-${{ matrix.abi }}-unsigned.apk"
          "$bt/aapt2" dump badging "$apk" | grep -E "^package|targetSdkVersion"
          READELF="$ANDROID_HOME/ndk/$GF_ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            ZIPALIGN="$bt/zipalign" \
            scripts/android/check-elf-alignment.sh "$apk"
          mkdir -p build/unsigned
          cp "$apk" build/unsigned/unsigned.apk

      # A bundle is not installed as it is: Play (or bundletool) cuts APKs
      # from it, and aligns them then. What it must hold is its manifest and
      # this ABI's libraries, and no signature yet.
      - name: Check The AAB
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          aab="build/artifacts/GpgFrontend-${ABI}-unsigned.aab"
          entries="$(unzip -Z1 "$aab")"
          grep -qx "base/manifest/AndroidManifest.xml" <<< "$entries"
          grep -q "^base/lib/${ABI}/.*\.so$" <<< "$entries"
          if grep -q "^META-INF/" <<< "$entries"; then
            echo "::error::$aab is already signed" >&2
            exit 1
          fi
          cp "$aab" build/unsigned/unsigned.aab

      - name: Upload Unsigned Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # NOT "gpgfrontend-*": that is the pattern the release job downloads,
          # and an unsigned package must never reach a release.
          name: unsigned-android-${{ matrix.arch }}
          path: |
            build/unsigned/unsigned.apk
            build/unsigned/unsigned.aab
          if-no-files-found: error

      # Separate, as build-macos does: it reaches provenance without passing
      # through sign-android, which takes nothing but the APK from here.
      - name: Upload Build Info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildinfo-android-${{ matrix.arch }}
          path: build/artifacts/build-info.json
          if-no-files-found: error

  # Signs the APK and the AAB with the release key. Every APK is signed by the
  # same key, so a newer build installs over an older one on a phone. The APK
  # takes apksigner (Android 11+ wants its v2+ schemes); the AAB takes
  # jarsigner, the only signer for a bundle. Like sign-macos: no checkout, no
  # build, and nothing read from the artifact but the two packages.
  sign-android:
    needs: build-android
    # Two independent gates on which refs may ever request the signing key: this
    # condition, and the deployment branch rule on the environment below. Never
    # a pull request, never a branch other than main, never a non-v tag.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        arch: ["arm64-v8a", "x86_64"]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The keystore lives in this environment, not in repository secrets.
    # Maintainer: configure its deployment branch rule to allow only `main`
    # and tags matching `v*`, as defence in depth behind the `if:` above.
    environment: android-signing
    steps:
      # Runs before anything else, and only tests for emptiness; no value is
      # printed, and an unset secret arrives as the empty string.
      - name: Preflight Check Signing Credentials
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ANDROID_KEYSTORE:-}" ] || missing="$missing ANDROID_KEYSTORE"
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing="$missing ANDROID_KEY_PASSWORD"

          if [ -n "$missing" ]; then
            echo "The 'android-signing' environment is missing:" >&2
            for name in $missing; do echo "  - $name" >&2; done
            echo >&2
            echo "Set them under Settings > Environments > android-signing." >&2
            echo "ANDROID_KEYSTORE is the keystore file (PKCS#12 or JKS), base64" >&2
            echo "encoded on one line (base64 -w0 release.p12). Keep that file:" >&2
            echo "an installed app only takes updates signed by the same key." >&2
            exit 1
          fi
          echo "all four signing credentials are present"

      - name: Install Build Tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"

      - name: Download Unsigned Packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-android-${{ matrix.arch }}
          path: ${{ runner.temp }}/unsigned

      # The names come from GitHub context and the matrix, never from the
      # artifact, as in sign-macos. One step, so the keystore is written once.
      # jarsigner without -strict: a self-signed release certificate is
      # normal on Android, and -strict fails on its chain warning.
      - name: Sign And Verify The APK And AAB
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          ks="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$ks"
          out="$RUNNER_TEMP/upload-artifact"
          mkdir -p "$out"
          apk="$out/GpgFrontend-${GITHUB_SHA:0:7}-android-${ARCH}.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/unsigned/unsigned.apk"
          rm -f "$apk.idsig"
          "$bt/apksigner" verify --verbose --print-certs "$apk" |
            grep -E "^Verified using|^Signer #1 certificate (DN|SHA-256)"

          # The bundle is not a release download: it goes up apart, below.
          bundle_out="$RUNNER_TEMP/upload-bundle"
          mkdir -p "$bundle_out"
          aab="$bundle_out/GpgFrontend-${GITHUB_SHA:0:7}-android-${ARCH}.aab"
          jarsigner -keystore "$ks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -digestalg SHA-256 \
            -signedjar "$aab" "$RUNNER_TEMP/unsigned/unsigned.aab" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$aab" | grep -x "jar verified."

          # Both packages by the one key, compared in apksigner's notation.
          apk_cert="$("$bt/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          aab_cert="$(keytool -printcert -jarfile "$aab" |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "AAB signer certificate SHA-256: $aab_cert"
          if [ -z "$apk_cert" ] || [ "$apk_cert" != "$aab_cert" ]; then
            echo "::error::the APK and the AAB were not signed by the same key" >&2
            exit 1
          fi

      # The release takes the APK alone.
      - name: Upload Signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpgfrontend-android-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload-artifact/*
          if-no-files-found: error

      # NOT "gpgfrontend-*": the signed bundle stays with the run and never
      # reaches the GitHub release.
      - name: Upload Signed AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-android-aab-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload-bundle/*
          if-no-files-found: error

  # Compiles and deploys the macOS bundle. Deliberately holds no secrets: the
  # Developer ID key must never share a runner with brew, cargo build scripts,
  # recursive submodules or third-party build actions. The bundle leaves here
  # unsigned and is signed by sign-macos below.
  build-macos:
    needs: setup
    # Nothing of macOS in a screenshot build; sign-macos and macos-smoke
    # depend on this job and are skipped with it.
    if: ${{ !inputs.screenshot }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.macos_runners) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # build-linux's PCH flags, plus what Xcode adds to every compile line:
      # an index-store path, a VFS stat cache and module flags.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime,clang_index_store,ivfsoverlay,modules
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
      GPGFRONTEND_BUILD_MODE: ${{ needs.setup.outputs.gpgfrontend_build_mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          submodules: recursive

      # Before anything is built: the entitlements the signing job will apply
      # must match the ones committed here. Cheap, and it fails before a build
      # is spent rather than after one is signed.
      - name: Check Entitlements Are In Sync
        run: scripts/check_entitlements_sync.sh

      # Saved only from pushes, so no pull request can seed an object file
      # into what a signed bundle is built from.
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ env.BUILD_TYPE }}
          # See build-linux: large enough per subdirectory for a PCH.
          max-size: 4G
          save: ${{ github.event_name == 'push' }}

      # See build-linux.
      - name: Mark ccache Epoch
        run: echo "CCACHE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Qt6
        uses: ./.github/actions/install-qt6

      - name: Install Dependence
        run: brew install --formula automake texinfo libarchive googletest libsodium openssl@3

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      # See build-linux for why this is not rust-cache. Under a multi-config
      # generator Corrosion puts the target dir one level down, in
      # <build>/<config>/cargo, which is why the path and key differ.
      - name: Restore Cargo Cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/${{ env.BUILD_TYPE }}/cargo
          key: cargo-xcode-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.BUILD_TYPE }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-xcode-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.BUILD_TYPE }}-

      - name: Build GpgFrontend
        run: scripts/ci/macos/build.sh --flavor installed

      - name: Save Cargo Cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/${{ env.BUILD_TYPE }}/cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'

      - name: Assemble The Bundle
        run: scripts/ci/macos/assemble_bundle.sh

      - name: Stage Unsigned Payload
        run: scripts/ci/macos/stage_unsigned.sh --dmg-dressing

      - name: Upload Unsigned Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # NOT "gpgfrontend-*": that is the pattern provenance downloads, and
          # an unsigned bundle must never reach a release.
          name: unsigned-macos-app-${{ matrix.os }}
          path: ${{ github.workspace }}/build/unsigned/*
          if-no-files-found: error

      # Separate and tiny, so it reaches macos-smoke and provenance without
      # passing through sign-macos, which never takes configuration from a
      # build artifact.
      - name: Upload Build Info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildinfo-${{ matrix.os }}-installed
          path: ${{ github.workspace }}/build/artifacts/build-info.json
          if-no-files-found: error

  sign-macos:
    needs: build-macos
    # Two independent gates on which refs may ever request the signing key: this
    # condition, and the deployment branch rule on the environment below. Never
    # a pull request, never a branch other than main, never a non-v tag.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: ["macos-15-intel", "macos-15", "macos-26-intel", "macos-26"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # All Apple signing material lives in this environment, not in repository
    # secrets. Maintainer: configure its deployment branch rule to allow only
    # `main` and tags matching `v*`, as defence in depth behind the `if:` above.
    environment: macos-signing
    steps:
      # Runs before anything else so a half-configured environment costs ten
      # seconds rather than a download, a full inside-out signing pass and a
      # notarization round trip. Only tests for emptiness; no value is printed,
      # and an unset secret arrives as the empty string.
      - name: Preflight Check Signing Credentials
        env:
          DEVELOP_ID_CERT: ${{ secrets.DEVELOP_ID_CERT }}
          DEVELOP_ID_CERT_PWD: ${{ secrets.DEVELOP_ID_CERT_PWD }}
          DEVELOPER_ID_CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${DEVELOP_ID_CERT:-}" ] || missing="$missing DEVELOP_ID_CERT"
          [ -n "${DEVELOP_ID_CERT_PWD:-}" ] || missing="$missing DEVELOP_ID_CERT_PWD"
          [ -n "${DEVELOPER_ID_CODE_SIGN_IDENTITY:-}" ] || missing="$missing DEVELOPER_ID_CODE_SIGN_IDENTITY"
          [ -n "${ASC_API_KEY_P8:-}" ] || missing="$missing ASC_API_KEY_P8"
          [ -n "${ASC_KEY_ID:-}" ] || missing="$missing ASC_KEY_ID"
          [ -n "${ASC_ISSUER_ID:-}" ] || missing="$missing ASC_ISSUER_ID"

          if [ -n "$missing" ]; then
            echo "The 'macos-signing' environment is missing:" >&2
            for name in $missing; do echo "  - $name" >&2; done
            echo >&2
            echo "Set them under Settings > Environments > macos-signing." >&2
            echo "The ASC_* trio comes from an App Store Connect API key:" >&2
            echo "  App Store Connect > Users and Access > Integrations >" >&2
            echo "  App Store Connect API > Team Keys > generate a key with the" >&2
            echo "  Developer role. ASC_API_KEY_P8 is the whole .p8 file including" >&2
            echo "  its BEGIN/END PRIVATE KEY lines (downloadable only once)," >&2
            echo "  ASC_KEY_ID is the Key ID column, ASC_ISSUER_ID the Issuer ID" >&2
            echo "  shown above the table." >&2
            exit 1
          fi
          echo "all six signing credentials are present"

      - name: Resolve Artifact Metadata
        id: meta
        env:
          # Nightly and stable builds are both Release; only pull requests use
          # RelWithDebInfo, and they never reach this job.
          BUILD_TYPE_LOWER: release
        run: |
          set -euo pipefail
          # Every name this job produces comes from GitHub context and runner
          # variables. Nothing is read back out of the downloaded artifact:
          # that would let the build side steer the privileged job. GITHUB_SHA
          # is set by the runner; eight hex digits is what `git rev-parse
          # --short HEAD` abbreviates to in this repository, so the macOS names
          # line up with the Linux and Windows artifacts.
          {
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "build_type_lower=${BUILD_TYPE_LOWER}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Unsigned Bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-macos-app-${{ matrix.os }}
          path: ${{ runner.temp }}/unsigned

      - name: Unpack Unsigned Bundle
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/unsigned/GpgFrontend.app.zip" "$RUNNER_TEMP/app"
          test -d "$RUNNER_TEMP/app/GpgFrontend.app"

      - name: Write Signing Policy And Helpers
        run: |
          set -euo pipefail

          # --- Entitlement policy -------------------------------------------
          # A verbatim copy of resource/entitlements/Normal.entitlements, and
          # deliberately a copy: reading it from the build artifact would let a
          # compromised build job pick its own entitlements and then verify them
          # against its own choice. Keep the two in sync by hand.
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <!-- disable-library-validation is deliberately absent; see
                   resource/entitlements/Normal.entitlements. -->

              <key>com.apple.security.cs.allow-jit</key>
              <true/>

              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # --- Explicit inside-out signer ------------------------------------
          # A `run:` step is its own shell process, so a function defined in one
          # step is invisible in the next; the helpers go on disk instead. The
          # heredocs are quoted, so nothing expands at write time and no secret
          # ever lands in a script file -- they read credentials from the
          # environment of the step that calls them.
          cat > "$RUNNER_TEMP/sign-bundle.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          APP="$1"
          ENTITLEMENTS="$2"
          : "${IDENTITY:?IDENTITY must be set}"

          # `--timestamp` is a network round trip to timestamp.apple.com for
          # every single object, and that service throttles and occasionally
          # just fails:
          #
          #   libgf_sdk.2.2.2.dylib: A timestamp was expected but was not found
          #
          # A bundle this size signs around a hundred objects, and shipping the
          # modules added six more, which is what made a pre-existing fragility
          # start showing up. Signing is idempotent under --force, so a retry is
          # safe.
          #
          # Only timestamp-shaped failures are retried. A wrong identity, a
          # locked keychain or a malformed object must still fail on the first
          # attempt and say so -- retrying those would turn a clear error into a
          # slow one.
          codesign_retrying() {
            local attempt=1
            local output
            while [ "$attempt" -le 5 ]; do
              if output="$(codesign "$@" 2>&1)"; then
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              case "$output" in
                *timestamp*|*Timestamp*|*"network connection"*|*"service is not available"*|*"Connection refused"*)
                  echo "  timestamp service failed (attempt $attempt/5), retrying:" >&2
                  printf '    %s\n' "$output" >&2
                  sleep $((attempt * 5))
                  attempt=$((attempt + 1))
                  ;;
                *)
                  printf '%s\n' "$output" >&2
                  return 1
                  ;;
              esac
            done
            echo "codesign could not obtain a timestamp after 5 attempts:" >&2
            printf '%s\n' "$output" >&2
            return 1
          }

          sign_inner() {   # nested code: hardened runtime, never entitlements
            codesign_retrying --force --timestamp --options=runtime \
              --sign "$IDENTITY" "$1"
          }

          # Gate: fail closed on any executable bundle type this script does not
          # handle deliberately. Two nets -- known bundle suffixes, and the
          # structural giveaway of a Contents/MacOS directory anywhere but the
          # app root. This is what stops the loose Mach-O pass from signing the
          # executable inside an unknown bundle while leaving that bundle
          # unsigned. If GpgFrontend ever gains an XPC service, an appex, a
          # helper app or a plugin bundle, its signing and entitlements get
          # added here on purpose.
          UNEXPECTED="$(mktemp)"
          {
            find "$APP/Contents" -type d \
              \( -name '*.app' -o -name '*.appex' -o -name '*.xpc' \
                 -o -name '*.bundle' -o -name '*.systemextension' \
                 -o -name '*.pluginkit' -o -name '*.qlgenerator' \)
            find "$APP/Contents" -type d -name 'MacOS' ! -path "$APP/Contents/MacOS"
          } > "$UNEXPECTED"
          if [ -s "$UNEXPECTED" ]; then
            echo "unexpected nested code bundle(s); extend sign-bundle.sh deliberately:" >&2
            cat "$UNEXPECTED" >&2
            exit 1
          fi
          rm -f "$UNEXPECTED"

          # Pass 1: loose Mach-O files outside any framework -- the gf_* dylibs
          # Xcode embeds via XCODE_EMBED_FRAMEWORKS, the gf_mod_* modules from
          # XCODE_EMBED_PLUGINS, and every Qt plugin and third-party dylib
          # macdeployqt copied in.
          #
          # NB: `[ x ] && continue` would abort the loop under `set -e` whenever
          # the test is false, so the skips are written as full if-blocks.
          find "$APP/Contents" -type f ! -path '*.framework/*' | while IFS= read -r f; do
            if [ "$f" = "$APP/Contents/MacOS/GpgFrontend" ]; then
              continue
            fi
            if file -b "$f" | grep -q 'Mach-O'; then
              sign_inner "$f"
            fi
          done

          # Pass 2: framework bundles, signed at the .framework path. The
          # Versions/A plus symlink layout is the normal shape of a macOS
          # framework, not a reason to sign a subdirectory. Nested code a
          # framework carries of its own is signed first; its own principal
          # executable is not signed separately, because the bundle signature
          # is what covers it.
          sign_framework() {
            fw="$1"
            name="$(basename "$fw" .framework)"
            find "$fw" -type f | while IFS= read -r f; do
              case "$f" in
                "$fw"/*.framework/*) continue ;;       # deeper framework, done
                "$fw"/Versions/*/"$name") continue ;;  # versioned framework binary
                "$fw"/"$name") continue ;;             # flat framework binary
              esac
              if file -b "$f" | grep -q 'Mach-O'; then
                sign_inner "$f"
              fi
            done
            sign_inner "$fw"
          }

          # -d walks depth first, so an inner framework is fully signed before
          # the one that contains it.
          find -d "$APP/Contents" -type d -name '*.framework' | while IFS= read -r fw; do
            sign_framework "$fw"
          done

          # Pass 3: the application itself, last, and the only thing that gets
          # entitlements. Through the same retry: the outer signature needs a
          # timestamp exactly as much as the inner ones, and it is the single
          # call whose loss wastes the whole job.
          codesign_retrying --force --timestamp --options=runtime \
            --entitlements "$ENTITLEMENTS" --sign "$IDENTITY" "$APP"
          SH

          # --- Notarization ---------------------------------------------------
          # Submits and gates on Accepted. It deliberately does not staple:
          # stapler cannot staple a .zip (that is only a transport for
          # notarytool), so stapling belongs at the call sites, which know
          # whether they hold a bundle or a disk image.
          cat > "$RUNNER_TEMP/notarize.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          TARGET="$1"
          # Guard again here: this script is what actually spends the
          # credential, and a clear message beats "parameter null or not set".
          : "${ASC_API_KEY_P8:?not set - add it to the macos-signing environment}"
          : "${ASC_KEY_ID:?not set - add it to the macos-signing environment}"
          : "${ASC_ISSUER_ID:?not set - add it to the macos-signing environment}"

          KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          RESULT="$RUNNER_TEMP/notary-result.json"
          # The key exists on disk only for the length of this one invocation.
          trap 'rm -f "$KEY_PATH"' EXIT
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"

          xcrun notarytool submit "$TARGET" \
            --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --output-format json > "$RESULT"

          # --wait exits 0 even when the verdict is Invalid, so read the verdict
          # back explicitly rather than trusting the exit status.
          STATUS="$(plutil -extract status raw -o - "$RESULT")"
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID="$(plutil -extract id raw -o - "$RESULT")"
            echo "notarization of $(basename "$TARGET") returned: $STATUS" >&2
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" >&2 || true
            exit 1
          fi
          echo "notarization accepted: $(basename "$TARGET")"
          SH

          # --- Stapling -------------------------------------------------------
          # Both staple and validate fetch the ticket from Apple's CloudKit
          # service, and a dropped connection there (NSURLError -1005, stapler
          # exit 68) says nothing about the ticket itself. By this point the
          # notarization is already accepted, so retry rather than lose the
          # job. Each verb retries on its own: a staple that already landed
          # is not redone just because the validate after it hit the network.
          # The window (~5.5 min per verb) is sized for CloudKit outages that
          # outlast a couple of minutes: a ~100s window was seen to lose all
          # five attempts to one.
          cat > "$RUNNER_TEMP/staple.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          TARGET="$1"
          MAX_ATTEMPTS=8
          for verb in staple validate; do
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              if xcrun stapler "$verb" "$TARGET"; then
                break
              fi
              if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
                echo "stapler $verb $(basename "$TARGET") failed after $MAX_ATTEMPTS attempts" >&2
                exit 1
              fi
              echo "stapler $verb failed (attempt $attempt/$MAX_ATTEMPTS), retrying" >&2
              sleep $(( attempt * 15 < 60 ? attempt * 15 : 60 ))
            done
          done
          SH

          # --- Entitlement equality check -------------------------------------
          cat > "$RUNNER_TEMP/check-entitlements.py" <<'PY'
          #!/usr/bin/env python3
          """Assert the signed bundle carries exactly the entitlements we asked for."""
          import plistlib
          import sys

          expected_path, actual_path = sys.argv[1], sys.argv[2]
          with open(expected_path, "rb") as f:
              expected = plistlib.load(f)
          with open(actual_path, "rb") as f:
              actual = plistlib.load(f)

          if expected == actual:
              print("entitlements match policy (%d keys)" % len(expected))
              sys.exit(0)

          for k in sorted(set(expected) - set(actual)):
              print("missing entitlement:    %s = %r" % (k, expected[k]), file=sys.stderr)
          for k in sorted(set(actual) - set(expected)):
              print("unexpected entitlement: %s = %r" % (k, actual[k]), file=sys.stderr)
          for k in sorted(set(expected) & set(actual)):
              if expected[k] != actual[k]:
                  print("changed entitlement:    %s: expected %r, got %r"
                        % (k, expected[k], actual[k]), file=sys.stderr)
          sys.exit(1)
          PY

          chmod 700 "$RUNNER_TEMP/sign-bundle.sh" "$RUNNER_TEMP/notarize.sh" \
            "$RUNNER_TEMP/staple.sh"

      - name: Prepare Signing Keychain
        env:
          DEVELOP_ID_CERT: ${{ secrets.DEVELOP_ID_CERT }}
          DEVELOP_ID_CERT_PWD: ${{ secrets.DEVELOP_ID_CERT_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Random per run: a hardcoded keychain password is a credential
          # checked into the repository.
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          umask 077
          printf '%s' "$DEVELOP_ID_CERT" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$DEVELOP_ID_CERT_PWD" -t cert -f pkcs12 -T /usr/bin/codesign
          # The private key is in the keychain now; the file is not needed again.
          rm -f "$CERT_PATH"

          # Without this codesign blocks on a UI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" > /dev/null

          # Prepend rather than replace: the Apple intermediate CAs live in the
          # system keychain and codesign must still find them. `security
          # list-keychains` prints one indented, double-quoted path per line;
          # strip only the indent and the two surrounding quotes, and collect
          # into the positional parameters (macOS bash is 3.2, no mapfile). A
          # here-doc rather than a pipe, so `set --` runs in this shell.
          set --
          while IFS= read -r line; do
            kc=$(printf '%s\n' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
            if [ -n "$kc" ]; then
              set -- "$@" "$kc"
            fi
          done <<EOF
          $(security list-keychains -d user)
          EOF
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$@"

          # The keychain stays unlocked and in the search list, so no later step
          # needs the password -- which is why it never leaves this step.

      - name: Sign Application
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sign-bundle.sh" "$RUNNER_TEMP/app/GpgFrontend.app" \
            "$RUNNER_TEMP/entitlements.plist"
          # --deep survives here for verification only, where recursing over
          # everything is exactly what is wanted. It never signs.
          codesign --verify --deep --strict --verbose=4 \
            "$RUNNER_TEMP/app/GpgFrontend.app"

      - name: Verify Embedded Entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/app/GpgFrontend.app"

          codesign -d --entitlements - --xml "$APP" \
            > "$RUNNER_TEMP/actual.entitlements" 2>/dev/null
          # Equality in both directions: an entitlement that appears only in the
          # signed result is as much a defect as a missing one.
          python3 "$RUNNER_TEMP/check-entitlements.py" \
            "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/actual.entitlements"

          # Entitlements are inert without the hardened runtime, and that is a
          # property of the signature, not of the entitlement dictionary.
          if ! codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "hardened runtime is not enabled on the signed app" >&2
            exit 1
          fi

          # Named explicitly, not left to the equality check above.
          #
          # That check compares the signed result against the expected plist in
          # both directions, so it already refuses a stray entitlement -- but it
          # would pass just as happily if someone re-added this one to BOTH
          # files. This says out loud which entitlement must never come back.
          #
          # It was needed while module code lived outside the bundle, where
          # Apple could not sign it. Modules now ship inside
          # Contents/Frameworks, signed with the app's own identity, which is
          # precisely the case Library Validation exists to permit. If modules
          # stop loading, the fix is a module signed with the wrong Team ID --
          # not this exception.
          if grep -q 'disable-library-validation' "$RUNNER_TEMP/actual.entitlements"; then
            echo "the signed app carries disable-library-validation;" >&2
            echo "module code is signed with the app's identity and does not" >&2
            echo "need it -- see resource/entitlements/Normal.entitlements" >&2
            exit 1
          fi
          echo "library validation is ON: no disable-library-validation entitlement"

      - name: Notarize And Staple Application
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          OS_IDENTIFIER: ${{ matrix.os }}
        run: |
          set -euo pipefail
          # notarytool only accepts an archive, so the bundle travels as a
          # throwaway zip; the ticket is issued against the bundle, so the
          # bundle is what gets stapled.
          ditto -c -k --keepParent "$RUNNER_TEMP/app/GpgFrontend.app" \
            "$RUNNER_TEMP/notarize-app.zip"
          "$RUNNER_TEMP/notarize.sh" "$RUNNER_TEMP/notarize-app.zip"
          "$RUNNER_TEMP/staple.sh" "$RUNNER_TEMP/app/GpgFrontend.app"
          rm -f "$RUNNER_TEMP/notarize-app.zip"

          # The .app is stapled but not shipped on its own: the dmg is the only
          # deliverable. Stapling it still matters, because the ticket travels
          # inside the dmg -- once a user drags the app to /Applications the
          # dmg's own staple no longer covers it, and without this the first
          # launch would need a network round trip to Apple.

      - name: Build Notarize And Staple Disk Image
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          OS_IDENTIFIER: ${{ matrix.os }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/upload-artifact"
          mkdir -p "$OUT"
          # The pattern every download follows (see the build job), with no
          # architecture: the runner label (macos-15, macos-15-intel) already
          # tells the images apart.
          DMG_NAME="GpgFrontend-${SHORT_SHA}-${OS_IDENTIFIER}.dmg"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          DMG="$OUT/$DMG_NAME"

          # hdiutil rather than create-dmg: this job runs Apple tooling only.
          # create-dmg drove Finder over AppleScript to place the icons, which
          # is exactly the part that flakes on a headless runner. The committed
          # .DS_Store carries the same window bounds and icon positions, so the
          # layout is reproduced without Finder ever being involved.
          STAGE="$RUNNER_TEMP/dmg-root"
          mkdir -p "$STAGE"
          ditto "$RUNNER_TEMP/app/GpgFrontend.app" "$STAGE/GpgFrontend.app"
          ln -s /Applications "$STAGE/Applications"
          cp "$RUNNER_TEMP/unsigned/DS_Store" "$STAGE/.DS_Store"
          cp "$RUNNER_TEMP/unsigned/VolumeIcon.icns" "$STAGE/.VolumeIcon.icns"

          # A read/write image first: the volume's custom-icon bit can only be
          # set on a mounted volume, and hdiutil cannot set it from -srcfolder.
          RW="$RUNNER_TEMP/rw.dmg"
          MNT="$RUNNER_TEMP/dmg-mnt"
          # -fs HFS+ is deliberate. Left to itself hdiutil now builds an APFS
          # image, which attaches as a nested container (a synthesised APFS
          # disk inside the image's own disk) -- detaching that by mount point
          # unmounts the volume but fails to eject the image, leaving the
          # convert step reading a still-attached file. HFS+ is also the
          # traditional read-only app-image format, mountable everywhere, and
          # what create-dmg produced before.
          #
          # -srcfolder makes hdiutil attach the new image internally and
          # detach it once the copy is done; on hosted runners XProtect or
          # Spotlight scanning the fresh volume can hold it at that detach
          # ("create failed - Resource busy"). The same race the detach
          # below retries, so retry here too, from a clean file each time.
          for attempt in 1 2 3 4 5; do
            rm -f "$RW"
            if hdiutil create -format UDRW -fs HFS+ -volname GpgFrontend \
              -srcfolder "$STAGE" -ov "$RW"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "could not create the disk image after 5 attempts" >&2
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt/5), retrying" >&2
            # A failed create can leave its internal attachment behind; drop
            # it so the next attempt does not trip over the same busy device.
            hdiutil info \
              | awk -v img="$RW" 'index($0, img) {f=1} f && /^\/dev\/disk/ {print $1; exit}' \
              | while read -r dev; do
                  hdiutil detach "$dev" -force > /dev/null 2>&1 || true
                done || true
            sleep $((attempt * 5))
          done

          # Detach by device node, not by mount point: the first line of
          # `hdiutil attach` output is the image's top-level device, and that
          # is the only handle that reliably ejects the whole image.
          ATTACH_OUT="$(hdiutil attach "$RW" -nobrowse -noautoopen -readwrite -noverify -mountpoint "$MNT")"
          printf '%s\n' "$ATTACH_OUT"
          DEV="$(printf '%s\n' "$ATTACH_OUT" | awk 'NR==1 {print $1}')"

          # Without the custom-icon attribute Finder ignores .VolumeIcon.icns.
          # SetFile ships with the Xcode command line tools and is deprecated,
          # so warn rather than fail if a future runner image drops it.
          if command -v SetFile > /dev/null 2>&1; then
            SetFile -a C "$MNT"
          else
            echo "::warning::SetFile not found; dmg volume icon not applied"
          fi

          # Spotlight or a volume scan can hold the image briefly after
          # SetFile, so retry before resorting to -force.
          for attempt in 1 2 3 4 5; do
            if hdiutil detach "$DEV" > /dev/null 2>&1; then
              DEV=""
              break
            fi
            echo "detach attempt ${attempt} failed; retrying"
            sleep 3
          done
          if [ -n "$DEV" ]; then
            hdiutil detach "$DEV" -force
          fi

          hdiutil convert "$RW" -format UDZO -o "$DMG" -ov
          rm -f "$RW"

          # Same timestamp exposure as every other signature, and by this point
          # the app is built, signed, notarized and stapled -- so losing the
          # job to a throttled timestamp service here is the most expensive
          # place for it to happen. Retried inline rather than through
          # sign-bundle.sh's helper, which is not sourced in this step.
          for attempt in 1 2 3 4 5; do
            if codesign --force --timestamp --sign "$IDENTITY" "$DMG"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "could not sign the disk image after 5 attempts" >&2
              exit 1
            fi
            echo "dmg signing failed (attempt $attempt/5), retrying" >&2
            sleep $((attempt * 5))
          done
          "$RUNNER_TEMP/notarize.sh" "$DMG"
          "$RUNNER_TEMP/staple.sh" "$DMG"

      - name: Assess With Gatekeeper
        run: |
          set -euo pipefail
          # The acceptance test: what macOS itself decides about the finished
          # deliverables, not just what codesign says about their structure.
          # --type execute is the assessment performed when the app is launched.
          spctl --assess --type execute --verbose=4 \
            "$RUNNER_TEMP/app/GpgFrontend.app"
          # --type open with the primary-signature context is what Finder
          # performs when the downloaded disk image is mounted.
          spctl --assess --type open --context context:primary-signature --verbose=4 \
            "$RUNNER_TEMP/upload-artifact/$DMG_NAME"
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpgfrontend-${{ matrix.os }}-installed
          path: ${{ runner.temp }}/upload-artifact/*

      - name: Clean Up Signing Material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc_api_key.p8" \
                "$RUNNER_TEMP/certificate.p12" \
                "$RUNNER_TEMP/sign-bundle.sh" \
                "$RUNNER_TEMP/notarize.sh" \
                "$RUNNER_TEMP/staple.sh" \
                "$RUNNER_TEMP/check-entitlements.py" \
                "$RUNNER_TEMP/notary-result.json"

  # Does the thing we ship actually work. Deliberately the dmg from sign-macos
  # -- signed, notarized, stapled -- and not the bundle build-macos produced,
  # because every step between those two can break loading. Unprivileged: no
  # Apple credentials, nothing to sign. It only consumes.
  macos-smoke:
    needs: [setup, sign-macos]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      # Same legs as sign-macos: an arm64 bundle cannot be smoke-tested on an
      # Intel runner, and a module that loads on one may not on the other.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.macos_runners) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"

      - name: Download Build Info
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: buildinfo-${{ matrix.os }}-installed
          path: buildinfo/

      - name: Download Signed Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gpgfrontend-${{ matrix.os }}-installed
          path: signed/

      - name: Mount, Assess And Launch
        run: scripts/ci/macos/smoke.sh signed buildinfo

  # Public build provenance, and the ONLY job in this workflow with
  # `id-token: write`.
  #
  # It turns the final, verified artifacts of every leg into the release
  # candidate: the deliverables and `SHA256SUMS.txt`, the canonical list of
  # what the release is. Nothing about the builds themselves is published.
  # It signs that one manifest and nothing else; the signature covers every
  # file the manifest hashes.
  #
  # Keyless Sigstore: Fulcio issues a short-lived certificate bound to this
  # job's OIDC identity, the signature and certificate go into the public Rekor
  # transparency log, and the private key exists for seconds and is never
  # written down. There is no signing secret here to steal or rotate.
  #
  # What this establishes and what it does not, stated plainly because the two
  # are easy to conflate:
  #
  #   it DOES     prove these exact bytes were produced by this workflow, at
  #               this commit, in this repository, and say so in a public log
  #               anyone can query without asking us
  #
  #   it does NOT authenticate a module descriptor, replace Apple code signing
  #               or Windows Authenticode, or participate in module loading at
  #               all. Runtime verification is offline and depends on none of
  #               this: a user with no network still gets every guarantee the
  #               Host makes about its modules.
  #
  # It needs macos-smoke, not only sign-macos: nothing is signed before every
  # platform check has passed on the bytes being signed.
  #
  # Nothing in here knows a platform. Legs are paired by artifact name
  # (`gpgfrontend-<leg>` with `buildinfo-<leg>`), so adding a leg changes
  # nothing below.
  #
  # Least privilege is the reason this is a separate job rather than a step in
  # `release`: `release` needs `contents: write` to publish, and nothing should
  # hold both the ability to mint an identity token and the ability to rewrite
  # the repository.
  provenance:
    needs: [build-linux, build-windows, sign-macos, macos-smoke, sign-android]
    runs-on: ubuntu-latest
    # No status function, so success() is implied: every job in `needs` must
    # have succeeded, not merely finished.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # The identity token Fulcio exchanges for a certificate. Nothing else.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"

      - name: Test Release Candidate Rules
        run: python3 -m unittest discover -s scripts/tests

      # Not merged: one directory per artifact, so the leg that produced each
      # file is known and two legs shipping the same file name is an error
      # instead of a silent overwrite.
      - name: Download Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: in/
          pattern: gpgfrontend-*

      - name: Download Build Info
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: in/
          pattern: buildinfo-*

      - name: Stage Release Candidate
        run: |
          set -euo pipefail
          python3 ./scripts/release_candidate.py stage \
            --artifacts in/ \
            --out candidate/

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign Manifest
        run: |
          set -euo pipefail
          COSIGN_EXPERIMENTAL=1 cosign sign-blob \
            --yes \
            --bundle candidate/SHA256SUMS.txt.sigstore.json \
            candidate/SHA256SUMS.txt

      # The immutability boundary. Nothing writes to candidate/ after the
      # signature, and the artifact is uploaded once: upload-artifact refuses a
      # second artifact of the same name in a run unless told to overwrite,
      # which this never is.
      - name: Upload Release Candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: candidate/*
          if-no-files-found: error

  # Verify-only publication. This job builds nothing, hashes nothing new and
  # signs nothing: it downloads the release candidate, proves it is exactly
  # what provenance signed, and publishes the files that proof listed.
  #
  # Only pushes to main publish the rolling nightly. Stable releases (version
  # tags) are packaged manually/offline.
  release:
    needs: [provenance]
    runs-on: ubuntu-latest
    # provenance already needs every build, signing and smoke job, so this
    # inherits all of them. success() is implied, as above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: nightly-release-approval
    permissions:
      # Deletes and re-creates the nightly tag and its release.
      contents: write
    steps:
      # For the verifier, the release notes and the tag. No submodules.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"

      - name: Download Release Candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate
          path: candidate/

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      # The whole publication gate, in order: the Sigstore identity (exactly
      # this workflow file at this ref, at this commit, from GitHub's issuer),
      # the manifest, exact set equality between the manifest and the
      # directory, and every hash. A valid signature made by some other
      # workflow is not evidence about this release.
      - name: Verify Release Candidate
        id: verify
        run: |
          set -euo pipefail
          python3 ./scripts/release_candidate.py verify \
            --dir candidate/ \
            --identity "https://github.com/${{ github.workflow_ref }}" \
            --sha "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate Nightly Release Title
        id: release_title
        run: echo "title=Nightly Build $(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Last, not first: deleting the release before the download and the
      # verification meant any failure among them left the project with no
      # nightly at all and a tag already moved.
      - name: Re-create nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ${{github.workspace}}
          gh release delete nightly --repo saturneric/GpgFrontend --cleanup-tag --yes || true
          git tag -f nightly $GITHUB_SHA
          git push origin nightly --force

      # Exactly the verified list, not a glob over a directory.
      - name: Update Nightly Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          name: ${{ steps.release_title.outputs.title }}
          draft: false
          prerelease: true
          body_path: ${{ github.workspace }}/.github/NIGHTLY_RELEASE.md
          files: ${{ steps.verify.outputs.files }}

  # Puts the arm64-v8a app bundle on Google Play's internal testing track, rolled
  # out to the testers at once, as soon as sign-android has signed it: it
  # waits for neither provenance nor the nightly's approval gate, which guard
  # the public GitHub release and not the testers.
  #   - a push to main  -> named nightly-<sha>.
  #   - a version tag   -> named after the tag. Promoting it beyond the
  #     testers is done by hand in Play Console.
  # arm64-v8a alone, as Play wants one bundle per release and phones are ARM;
  # x86_64 stays on the nightly page.
  #
  # Play App Signing re-signs what users get, so the bundle is signed here
  # with the upload key, not the release key that signs the APKs: it is the
  # unsigned bundle from build-android, signed again for this one purpose.
  #
  # Maintainer, once, before this can pass:
  #   - create the app (com.bktus.gpgfrontend) in Play Console, enable Play
  #     App Signing, and upload a first bundle there by hand: the API cannot
  #     create an app;
  #   - register the upload key's certificate as the app's upload key;
  #   - grant a Google Cloud service account "Release to testing tracks" for
  #     the app, and put its JSON key in the environment below.
  # While the app has never been published, Play takes only draft releases:
  # pass --status draft until then.
  play-upload:
    needs: [sign-android]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The upload key and the service-account key live in this environment.
    # Maintainer: configure its deployment rule to allow only `main` and tags
    # matching `v*`.
    environment: google-play
    steps:
      - name: Preflight Check Play Credentials
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${PLAY_UPLOAD_KEYSTORE:-}" ] || missing="$missing PLAY_UPLOAD_KEYSTORE"
          [ -n "${PLAY_UPLOAD_KEYSTORE_PASSWORD:-}" ] || missing="$missing PLAY_UPLOAD_KEYSTORE_PASSWORD"
          [ -n "${PLAY_UPLOAD_KEY_ALIAS:-}" ] || missing="$missing PLAY_UPLOAD_KEY_ALIAS"
          [ -n "${PLAY_UPLOAD_KEY_PASSWORD:-}" ] || missing="$missing PLAY_UPLOAD_KEY_PASSWORD"
          [ -n "${PLAY_SERVICE_ACCOUNT_JSON:-}" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"

          if [ -n "$missing" ]; then
            echo "The 'google-play' environment is missing:" >&2
            for name in $missing; do echo "  - $name" >&2; done
            echo >&2
            echo "Set them under Settings > Environments > google-play." >&2
            echo "PLAY_UPLOAD_KEYSTORE is the upload keystore (PKCS#12 or JKS)," >&2
            echo "base64 encoded on one line. PLAY_SERVICE_ACCOUNT_JSON is the" >&2
            echo "service account's JSON key file, as Google Cloud gives it." >&2
            exit 1
          fi
          echo "all five Play credentials are present"

      # The upload script only; nothing of the build.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          sparse-checkout: scripts/android

      - name: Download Unsigned Bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-android-arm64-v8a
          path: ${{ runner.temp }}/unsigned

      - name: Sign The Bundle With The Upload Key
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          ks="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$ks"
          aab="$RUNNER_TEMP/play/GpgFrontend-${GITHUB_SHA:0:7}-android-arm64-v8a.aab"
          mkdir -p "$(dirname "$aab")"
          jarsigner -keystore "$ks" \
            -storepass:env PLAY_UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env PLAY_UPLOAD_KEY_PASSWORD \
            -digestalg SHA-256 \
            -signedjar "$aab" "$RUNNER_TEMP/unsigned/unsigned.aab" \
            "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify "$aab" | grep -x "jar verified."
          keytool -printcert -jarfile "$aab" | grep -E "^[[:space:]]*SHA256:"

      # The ref was already checked by the job's `if:`; anything but a v* tag
      # here is main.
      - name: Upload To The Internal Track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="$GITHUB_REF_NAME"
          else
            name="nightly-${GITHUB_SHA:0:7}"
          fi
          python3 -I scripts/android/play_upload.py \
            --package com.bktus.gpgfrontend \
            --bundle "$RUNNER_TEMP/play/GpgFrontend-${GITHUB_SHA:0:7}-android-arm64-v8a.aab" \
            --track internal \
            --release-name "$name"
