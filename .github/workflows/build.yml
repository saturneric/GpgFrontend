name: Build 2.1 (Qt6)

# CI for the legacy 2.1.x series only. main (2.2.x) has its own workflows.
on:
  push:
    branches:
      - release/2.1
    tags:
      - "v2.1.*"
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  pull_request:
    branches:
      - release/2.1
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - release

# A newer push supersedes a running build of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  GNUPG_VERSION: "2.5.21"

jobs:
  build:
    strategy:
      matrix:
        os:
          [
            "ubuntu-22.04",
            "ubuntu-24.04-arm",
            "macos-14",
            "macos-15-intel",
            "macos-15",
            "macos-26-intel",
            "macos-26",
            "windows-2022",
            "windows-2025",
          ]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      # Lets ccache cache every translation unit that force-includes the CMake
      # PCH, and the .gch itself. Without these they were all uncacheable, so
      # even a warm cache rebuilt core, ui and test in full. Only timestamp and
      # __DATE__-style checks are relaxed; what is hashed into an object is
      # unchanged.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    # The Apple signing material lives in the `macos-signing` environment, not
    # in repository secrets. Only macOS pushes and tags ask for it: pull
    # requests never get signing credentials and build unsigned instead. The
    # environment's deployment branch rule has to allow release/2.1 and v2.1.*.
    environment: ${{ (startsWith(matrix.os, 'macos') && github.event_name != 'pull_request') && 'macos-signing' || '' }}
    steps:
      - name: Set git to use LF(Windows) or CRLF(MacOS) line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        if: runner.os == 'Windows'  || runner.os == 'macOS'

      - uses: actions/checkout@v6
        with:
          lfs: "false"
          submodules: recursive

      - name: Setup Build Mode
        shell: bash
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OS_IDENTIFIER=${{ matrix.os }}" >> $GITHUB_ENV

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            BUILD_MODE="${{ github.event.inputs.build_mode }}"
            if [[ "${BUILD_MODE}" == "release" ]]; then
              BUILD_TYPE_EFFECTIVE="Release"
            else
              BUILD_TYPE_EFFECTIVE="RelWithDebInfo"
            fi

          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BUILD_MODE="pr"
            BUILD_TYPE_EFFECTIVE="RelWithDebInfo"

          elif [[ "${GITHUB_REF_NAME}" == release/* || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_MODE="release"
            BUILD_TYPE_EFFECTIVE="Release"

          else
            BUILD_MODE="nightly"
            BUILD_TYPE_EFFECTIVE="RelWithDebInfo"
          fi

          echo "BUILD_MODE=${BUILD_MODE}" >> $GITHUB_ENV
          echo "BUILD_TYPE=${BUILD_TYPE_EFFECTIVE}" >> $GITHUB_ENV
          echo "BUILD_TYPE_LOWER=$(echo ${BUILD_TYPE_EFFECTIVE} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

          echo "SANDBOX_CMAKE_FLAG=" >> $GITHUB_ENV
          echo "CODE_SIGNING_IDENTITY=${{secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY}}" >> $GITHUB_ENV
          # Sign (and notarize) only when the signing environment handed us a
          # certificate; otherwise the macOS build is ad-hoc signed.
          echo "MACOS_SIGNING=${{ secrets.DEVELOP_ID_CERT != '' && '1' || '0' }}" >> $GITHUB_ENV

          echo "Build mode: ${BUILD_MODE}"
          echo "Build type: ${BUILD_TYPE_EFFECTIVE}"

      # Saved only from pushes, so no pull request can seed an object file
      # into what a release is built from.
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: 2.1-${{ github.job }}-${{ matrix.os }}-${{ env.BUILD_TYPE }}
          # ccache caps each of its 16 subdirectories at 1/16 of this, and a
          # compressed .gch runs past 100 MB, so a smaller limit evicted every
          # PCH result as it was stored.
          max-size: 4G
          save: ${{ github.event_name == 'push' }}

      # Everything compiled from here on touches the cache entries it uses, so
      # "older than this mark" is exactly "not used by this build". The build
      # steps evict those before the post step saves the cache.
      - name: Mark ccache Epoch
        shell: bash
        run: echo "CCACHE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Dependence (Linux)
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential binutils git autoconf automake gettext texinfo
          sudo apt-get -y install gcc g++ ninja-build
          sudo apt-get -y install libarchive-dev libssl-dev libargon2-dev
          sudo apt-get -y install gpgsm libxcb-xinerama0 libxcb-icccm4-dev libcups2-dev libdrm-dev libegl1-mesa-dev
          sudo apt-get -y install libfuse2 libgcrypt20-dev libnss3-dev libpci-dev libpulse-dev libudev-dev libxtst-dev
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-image0 gyp
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-* libxkbcommon-x11-0
          sudo apt-get -y install libwayland-cursor0 libwayland-egl1
        if: runner.os == 'Linux'

      - name: Codesign Configuration (macOS)
        run: |
          APP_CERT_PATH=$RUNNER_TEMP/app_certificate.p12

          # Import the Developer ID certificate into a temporary keychain. A
          # Developer ID build needs no provisioning profile.
          echo -n "${{secrets.DEVELOP_ID_CERT}}" | base64 --decode -o $APP_CERT_PATH

          security create-keychain -p gpgfrontend build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p gpgfrontend build.keychain
          security import $APP_CERT_PATH -k build.keychain -P "${{secrets.DEVELOP_ID_CERT_PWD}}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k gpgfrontend build.keychain
          security set-keychain-settings -lut 3600
          rm -f $APP_CERT_PATH
        if: runner.os == 'macOS' && env.MACOS_SIGNING == '1'

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          cache: "true"
        if: runner.os == 'Linux' || runner.os == 'macOS'

      - name: Install Dependence (macOS)
        run: |
          brew install --formula automake texinfo libarchive googletest create-dmg argon2
        if: runner.os == 'macOS'

      - name: Set up MinGW (Windows)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          update: false
          release: false
          cache: true
          install: >-
            git
            zip
            unzip
            msys2-devel
            base-devel
            msys2-runtime-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-libassuan
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-argon2
        if: runner.os == 'Windows'

      - name: Build GpgME (macOS)
        run: |
          cd ${{github.workspace}}/third_party/gpgme
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-static \
          --disable-shared \
          --enable-silent-rules \
          --disable-dependency-tracking \
          --enable-languages=cl \
          --disable-gpgconf-test \
          --disable-gpg-test \
          --disable-gpgsm-test \
          --disable-g13-test
          make -j$(sysctl -n hw.logicalcpu)
          sudo make install
        if: runner.os == 'macOS'

      - name: Build GpgME (Windows)
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          cd third_party/gpgme
          export CC="ccache gcc"
          export CXX="ccache g++"
          export CFLAGS="${CFLAGS} -Wno-int-conversion -Wno-incompatible-pointer-types"
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-maintainer-mode \
          --enable-static \
          --disable-shared \
          --enable-silent-rules \
          --disable-dependency-tracking \
          --enable-languages=cl \
          --disable-gpgconf-test \
          --disable-gpg-test \
          --disable-gpgsm-test \
          --disable-g13-test \
          --enable-w32-glib
          make -j$(nproc)
          make install
        if: runner.os == 'Windows'

      - name: Cache googletest (Linux)
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/third_party/googletest
          key: gtest-${{ matrix.os }}-v1.15.2
        if: runner.os == 'Linux'

      - name: Build googletest (Linux)
        run: |
          if [ ! -f "${{github.workspace}}/third_party/googletest/build/build.ninja" ]; then
            rm -rf ${{github.workspace}}/third_party/googletest
            git clone --depth 1 --branch v1.15.2 https://github.com/google/googletest.git ${{github.workspace}}/third_party/googletest
            cd ${{github.workspace}}/third_party/googletest
            mkdir build && cd build
            cmake -G Ninja -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              ..
            ninja
          else
            echo "Reusing cached googletest build"
          fi
          cd ${{github.workspace}}/third_party/googletest/build
          sudo ninja install
        if: runner.os == 'Linux'

      - name: Build GpgFrontend (macOS)
        run: |
          MACOS_MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          MACOS_MINOR=$(sw_vers -productVersion | cut -d. -f2)

          if [[ "$MACOS_MAJOR" == "13" ]]; then
            DEPLOY_TARGET="13.0"
          elif [[ "$MACOS_MAJOR" == "14" ]]; then
            DEPLOY_TARGET="14.0"
          elif [[ "$MACOS_MAJOR" == "15" ]]; then
            DEPLOY_TARGET="15.0"
          elif [[ "$MACOS_MAJOR" == "26" ]]; then
            DEPLOY_TARGET="26.0"
          else
            DEPLOY_TARGET="${MACOS_MAJOR}.${MACOS_MINOR}"
          fi

          echo "Set MacOS Deployment Target: $DEPLOY_TARGET"

          cmake -B ${{github.workspace}}/build -G Xcode \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${DEPLOY_TARGET} \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON

          # Build unsigned; the bundle is signed after macdeployqt has put the
          # Qt frameworks in place. The *_DEPLOYMENT_TARGET overrides keep newer
          # Xcode from aborting on conflicting deployment targets.
          # ccache, as xcodebuild build settings rather than a CMake launcher,
          # which the Xcode generator ignores. CC/CXX go through a wrapper;
          # LD/LDPLUSPLUS stay the plain driver so links never see a
          # compile-only flag. -fno-pch-timestamp: a .pch restored from the
          # cache would otherwise be refused against this checkout's header
          # mtimes. The index store only adds an uncacheable output.
          WRAP="$RUNNER_TEMP/ccache-xcode"
          mkdir -p "$WRAP"
          REAL_CC="$(xcrun -f clang)"
          REAL_CXX="$(xcrun -f clang++)"
          printf '#!/bin/sh\nexec ccache "%s" -Xclang -fno-pch-timestamp "$@"\n' "$REAL_CC" > "$WRAP/clang"
          printf '#!/bin/sh\nexec ccache "%s" -Xclang -fno-pch-timestamp "$@"\n' "$REAL_CXX" > "$WRAP/clang++"
          chmod +x "$WRAP/clang" "$WRAP/clang++"
          ccache -z

          cd ${{github.workspace}}/build/
          xcodebuild -project ${{github.workspace}}/build/GpgFrontend.xcodeproj \
            -scheme GpgFrontend \
            -configuration "${{env.BUILD_TYPE}}" \
            -archivePath ${{github.workspace}}/build/GpgFrontend.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CC="$WRAP/clang" \
            CXX="$WRAP/clang++" \
            LD="$REAL_CC" \
            LDPLUSPLUS="$REAL_CXX" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            IPHONEOS_DEPLOYMENT_TARGET= \
            TVOS_DEPLOYMENT_TARGET= \
            WATCHOS_DEPLOYMENT_TARGET= \
            XROS_DEPLOYMENT_TARGET= \
            DRIVERKIT_DEPLOYMENT_TARGET=
          ccache -s -v
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s

          # Copy the app out of the archive instead of -exportArchive, which
          # demands a signing identity in the keychain.
          mkdir -p ${{github.workspace}}/build/package
          cp -R ${{github.workspace}}/build/GpgFrontend.xcarchive/Products/Applications/GpgFrontend.app \
            ${{github.workspace}}/build/package/
        if: runner.os == 'macOS'

      - name: Deploy Qt & Code Sign (macOS)
        run: |
          APP=${{github.workspace}}/build/package/GpgFrontend.app

          macdeployqt "$APP" -verbose=2 -always-overwrite

          if [ "${MACOS_SIGNING}" = "1" ]; then
            codesign -s "${CODE_SIGNING_IDENTITY}" \
              -f --deep --options=runtime --timestamp "$APP"
          else
            echo "No signing credentials, signing ad-hoc."
            codesign -s - -f --deep "$APP"
          fi

          codesign --verify --deep --strict --verbose=4 "$APP"
        if: runner.os == 'macOS'

      - name: Package & Sign App Bundle (macOS)
        run: |
          if [ "${MACOS_SIGNING}" = "1" ]; then
            security -v unlock-keychain -p gpgfrontend build.keychain
            DMG_SIGN_ARGS=(--codesign "${CODE_SIGNING_IDENTITY}")
          else
            DMG_SIGN_ARGS=()
          fi
          ditto -c -k --keepParent ${{github.workspace}}/build/package/GpgFrontend.app ${{github.workspace}}/build/GpgFrontend.app.zip
          hdiutil create ${{github.workspace}}/build/tmp.dmg -ov \
            -volname "GpgFrontend" -fs HFS+ -srcfolder ${{github.workspace}}/build/package/
          mkdir ${{github.workspace}}/build/upload-artifact
          create-dmg "${DMG_SIGN_ARGS[@]}" --volicon "${{github.workspace}}/resource/lfs/icns/GpgFrontend.icns" --volname GpgFrontend --app-drop-link 600 185 --window-size 800 400 ${{github.workspace}}/build/upload-artifact/GpgFrontend.dmg ${{github.workspace}}/build/package/GpgFrontend.app
          mv ${{github.workspace}}/build/upload-artifact/GpgFrontend.dmg \
            ${{github.workspace}}/build/upload-artifact/GpgFrontend-${{env.OS_IDENTIFIER}}-${{env.SHORT_SHA}}.dmg
          mv ${{github.workspace}}/build/GpgFrontend.app.zip \
            ${{github.workspace}}/build/GpgFrontend-${{env.OS_IDENTIFIER}}-${{env.SHORT_SHA}}.zip
        if: runner.os == 'macOS'

      - name: Notarize macOS Build (macOS)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "${ASC_API_KEY_P8}" ] || [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ]; then
            echo "The macos-signing environment has no App Store Connect API key; skipping notarization."
            exit 0
          fi
          KEY_PATH=$RUNNER_TEMP/asc_api_key.p8
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          xcrun notarytool submit \
            ${{github.workspace}}/build/GpgFrontend-${{env.OS_IDENTIFIER}}-${{env.SHORT_SHA}}.zip \
            --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          rm -f "$KEY_PATH"
        if: runner.os == 'macOS' && env.MACOS_SIGNING == '1'

      - name: Build GpgFrontend (Linux)
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$LD_LIBRARY_PATH
          cmake -B ${{github.workspace}}/build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DGPGFRONTEND_BUILD_APP_IMAGE=ON \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON
          cmake --build ${{ github.workspace }}/build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel \
            --verbose
          ccache -s -v 2>/dev/null || ccache -s
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s
        if: runner.os == 'Linux'

      - name: Run Unit Tests (Linux)
        # The suite reports failures in its log but always exits 0, so the
        # step surfaces the gtest summary instead of gating on the exit code.
        run: |
          sudo apt-get -y install gnupg
          BIN=$(find ${{github.workspace}}/build/artifacts -type f -name gpgfrontend -perm -u+x | head -n 1)
          if [ -z "$BIN" ]; then
            echo "gpgfrontend binary not found" >&2
            exit 1
          fi
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$(dirname "$BIN")/../lib:$LD_LIBRARY_PATH
          QT_QPA_PLATFORM=offscreen timeout 1200 "$BIN" --test 2>&1 | tee ${{github.workspace}}/build/unit-test.log || true
          {
            echo "### Unit tests (${{ matrix.os }})"
            echo '```'
            grep -E '^\[  (PASSED|FAILED)  \]' ${{github.workspace}}/build/unit-test.log || echo "no gtest summary found"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        if: runner.os == 'Linux'

      - name: Package App Image (Linux)
        run: |
          QT_PLUGIN_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          echo "Found Qt plugin dir: $QT_PLUGIN_DIR"

          # enter the sqldrivers directory
          cd $QT_PLUGIN_DIR/sqldrivers

          # remove all non-sqlite drivers to reduce the size of the final AppImage
          find . -type f ! -name '*sqlite*' -delete
          ls -l

          # return to the root of the repository
          cd ${{github.workspace}}

          mkdir ${{github.workspace}}/build/upload-artifact
          cd ${{github.workspace}}/build/upload-artifact

          ARCH=$(uname -m)
          if [[ "$ARCH" == "x86_64" ]]; then
            wget -c -nv https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
            mv linuxdeployqt-continuous-x86_64.AppImage linuxdeployqt-continuous.AppImage 
            EXTRA_ARGS=""
          elif [[ "$ARCH" == "aarch64" ]]; then
            wget -c -nv https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-aarch64.AppImage
            mv linuxdeployqt-continuous-aarch64.AppImage linuxdeployqt-continuous.AppImage
            mkdir -p ${{github.workspace}}/build/artifacts/AppDir/usr/share/doc/libc6/
            touch ${{github.workspace}}/build/artifacts/AppDir/usr/share/doc/libc6/copyright        
            EXTRA_ARGS="-unsupported-allow-new-glibc"
          fi

          chmod u+x linuxdeployqt-continuous.AppImage
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$LD_LIBRARY_PATH
          ./linuxdeployqt-continuous.AppImage \
            ${{github.workspace}}/build/artifacts/AppDir/usr/share/applications/*.desktop \
            $EXTRA_ARGS \
            -no-translations \
            -extra-plugins=iconengines,platforms,sqldrivers/libqsqlite.so \
            -appimage \
            -executable-dir=${{github.workspace}}/build/artifacts/AppDir/usr/lib/modules
        if: runner.os == 'Linux'

      - name: Build GpgFrontend (Windows)
        shell: msys2 {0}
        env:
          # ccache takes MinGW's `c++.exe` for an unknown compiler and then
          # applies clang's PCH rule: refuse a cached .gch whose headers have a
          # new mtime. CMake rewrites cmake_pch.hxx at every configure, so every
          # PCH and its users missed on every run. It is gcc.
          CCACHE_COMPILERTYPE: gcc
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON \
            ..
          cmake --build . \
            --config ${{ env.BUILD_TYPE }} \
            --parallel \
            --verbose
          ccache -s -v
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s
        if: runner.os == 'Windows'

      - name: Download GnuPG Binary Release (Windows)
        shell: msys2 {0}
        run: |
          export URL="https://ftp.bktus.com/GnuPG/${{env.GNUPG_VERSION}}"
          export KEY_URL="https://bktus.com/pgp/saturneric-code-signing.asc"
          export KEY_FPR="12F7E8858CF15BEC9975FF3C5CA3DA246843FD03"
          export KEY_FILE="saturneric-code-signing.asc"
          export FILE="gnupg.zip"
          export CHECKSUM_FILE="SHA256SUMS.txt"
          export SIGNATURE_FILE="gnupg.zip.sig"
          export GNUPGHOME=$(mktemp -d)

          cd $(cygpath -u "${{github.workspace}}")

          mkdir -p build/downloads

          curl -fL --retry 3 -o build/downloads/$FILE $URL/$FILE
          curl -fL --retry 3 -o build/downloads/$CHECKSUM_FILE $URL/$CHECKSUM_FILE
          curl -fL --retry 3 -o build/downloads/$KEY_FILE $KEY_URL
          curl -fL --retry 3 -o build/downloads/$SIGNATURE_FILE $URL/$SIGNATURE_FILE

          gpg --import build/downloads/$KEY_FILE

          # Trust is pinned to this exact fingerprint, not to whatever the
          # downloaded key file happens to contain.
          if ! KEY_INFO=$(gpg --batch --with-colons --list-keys "$KEY_FPR"); then
            echo "Imported key does not match fingerprint $KEY_FPR!" >&2
            exit 1
          fi

          EXPIRES=$(echo "$KEY_INFO" | awk -F: '/^pub:/ {print $7; exit}')
          if [ -n "$EXPIRES" ]; then
            echo "Signing key expires: $(date -u -d "@$EXPIRES")"
            if [ "$EXPIRES" -le "$(date +%s)" ]; then
              echo "Signing key has expired!" >&2
              exit 1
            fi
          else
            echo "Signing key has no expiration date"
          fi

          # VALIDSIG carries the primary key fingerprint as its last field, so
          # this also rejects a valid signature from any other imported key.
          if ! gpg --status-fd 1 --verify build/downloads/$SIGNATURE_FILE \
              build/downloads/$FILE | grep "VALIDSIG" | grep -q "$KEY_FPR"; then
            echo "GnuPG signature verification failed!" >&2
            exit 1
          fi

          CHECKSUM=$(grep "$FILE\$" build/downloads/$CHECKSUM_FILE | awk '{print $1}')
          ACTUAL_CHECKSUM=$(sha256sum build/downloads/$FILE | awk '{print $1}')
          echo "Expected Checksum: $CHECKSUM"
          echo "Actual Checksum: $ACTUAL_CHECKSUM"
          if [ "$CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
            echo "Checksum verification failed!" >&2
            exit 1
          fi

          mkdir -p build/artifacts/gnupg

          # Extraction has to be byte-exact. A text-mode extractor rewrites every
          # LF as CRLF, which shifts each PE image away from the offset its
          # e_lfanew field points at: the staged binaries then carry no readable
          # Authenticode signature and Windows refuses to load them, while the
          # archive-level OpenPGP and SHA256 checks above still pass because the
          # downloaded zip is intact. bsdtar has no text mode at all.
          if command -v bsdtar >/dev/null 2>&1; then
            bsdtar -xf build/downloads/$FILE -C build/artifacts/gnupg
          else
            unzip -o build/downloads/$FILE -d build/artifacts/gnupg/
          fi

          # Gate the staged payload rather than trusting the extractor: every
          # image must still start with MZ and hold the PE signature exactly
          # where e_lfanew points.
          BROKEN=0
          COUNT=0
          while IFS= read -r pe; do
            COUNT=$((COUNT + 1))
            MZ=$(dd if="$pe" bs=1 count=2 2>/dev/null | od -An -tx1 | tr -d ' \n')
            OFF=$(od -An -tu4 -j 60 -N 4 "$pe" | tr -d ' ')
            SIG=$(dd if="$pe" bs=1 skip="$OFF" count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
            if [ "$MZ" != "4d5a" ] || [ "$SIG" != "50450000" ]; then
              echo "corrupt PE image: $pe (mz=$MZ e_lfanew=$OFF sig=$SIG)" >&2
              BROKEN=$((BROKEN + 1))
            fi
          done < <(find build/artifacts/gnupg -type f \( -name '*.exe' -o -name '*.dll' \))

          if [ "$BROKEN" -ne 0 ]; then
            echo "$BROKEN of $COUNT staged GnuPG images are not loadable PE files!" >&2
            type -a bsdtar unzip >&2 || true
            env | grep -iE '^(UNZIP|UNZIPOPT|ZIPOPT|MSYS|CYGWIN)=' >&2 || true
            exit 1
          fi
          echo "verified $COUNT staged GnuPG PE images"

          ls -l build/artifacts/gnupg/
        if: runner.os == 'Windows'

      - name: Package (Windows)
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          cp PrivacyPolicy.md build/artifacts/
          cp README.md build/artifacts/
          cp SECURITY.md build/artifacts/
          cp TRANSLATORS build/artifacts/
          cp COPYING build/artifacts/
          cp gpgfrontend.ico build/artifacts/bin/
          rm -rf build/artifacts/bin/*.a
          rm -rf build/artifacts/bin/modules/*.a
          mv build/artifacts/bin/modules build/artifacts/modules
          touch build/artifacts/bin/ENV.ini
          echo "PortableMode=true" >> build/artifacts/bin/ENV.ini
          cd build
          windeployqt6 --no-translations --force ./artifacts/bin/libgf_core.dll
          windeployqt6 --no-translations --force ./artifacts/bin/libgf_ui.dll
          windeployqt6 --no-translations --force ./artifacts/bin/libgf_test.dll
          windeployqt6 --no-translations --force ./artifacts/bin/GpgFrontend.exe
          for module in ./artifacts/modules/*.dll; do
            windeployqt6 --no-translations --force "$module"
          done
          mkdir upload-artifact
          cd artifacts
          zip -r ../upload-artifact/GpgFrontend-${{env.SHORT_SHA}}-${{matrix.os}}-x86_64.zip *
        if: runner.os == 'Windows'

      - name: Upload Artifact (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: gpgfrontend-2.1-${{matrix.os}}-${{env.BUILD_TYPE_LOWER}}-${{env.SHORT_SHA}}
          path: ${{github.workspace}}/build/upload-artifact/Gpg_Frontend*.AppImage*
        if: runner.os == 'Linux'

      - name: Upload Artifact (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: gpgfrontend-2.1-${{env.OS_IDENTIFIER}}-${{env.BUILD_TYPE_LOWER}}-${{env.SHORT_SHA}}
          path: ${{github.workspace}}/build/upload-artifact/*
        if: runner.os == 'macOS'

