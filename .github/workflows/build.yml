#
# Layout (release/2.1)
# --------------------
#   setup        checks the release tooling, decides the build mode once
#   build-qt6    AppImage (x86_64, aarch64), DMG per macOS, MSI and portable ZIP
#   build-qt5    AppImage (x86_64) and portable ZIP: 2.1 is the last series
#                that builds with Qt5
#   provenance   signs the release candidate after every leg has succeeded
#   stage        hands it to the signing host (scripts/release/gfrelease)
#
# 2.1 is a legacy series (release/policy.toml): only its release tags are
# published. A push to release/2.1 builds every leg as a check and publishes
# nothing, so 2.1 has no beta channel.
#
# Every leg uploads exactly `gpgfrontend-<leg>`, the files it ships named by
# scripts/ci/artifact_name.sh, and `buildinfo-<leg>`, the build-info.json its
# build wrote. That pairing is all `gfrelease candidate stage` needs, and
# release/product.json reads each file's platform, architecture and flavour
# (qt5 included) back from its name.

name: Build

on:
  push:
    branches:
      - release/2.1
    tags:
      - "v2.1.*"
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  pull_request:
    branches:
      - release/2.1
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - release

# A newer push supersedes a running build of the same ref; each tag has a
# lane of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Nothing here publishes a release; the signing
# host promotes what `stage` hands it.
permissions:
  contents: read

env:
  # The GnuPG for Windows bundle the Windows packages ship, fetched and
  # verified against a pinned key by scripts/ci/windows/fetch_gnupg.sh.
  GNUPG_VERSION: "2.5.24"

jobs:
  # Cheap checks of the release tooling before any runner compiles anything,
  # and the build mode, decided once and handed to every build job.
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.mode.outputs.version }}
      artifact_version: ${{ steps.mode.outputs.artifact_version }}
      build_type: ${{ steps.mode.outputs.build_type }}
      publish_kind: ${{ steps.mode.outputs.publish_kind }}
      publishes: ${{ steps.mode.outputs.publishes }}
    steps:
      # The whole history and every tag: the version is derived from them
      # (cmake/GitVersion.cmake), and a shallow clone has neither.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          fetch-depth: 0
          persist-credentials: false

      - name: Check Workflow Steps Define What They Read
        run: python3 scripts/check_workflow_steps.py

      - name: Install Release Tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q minisign

      - name: Check Release Policy
        run: scripts/gfrelease policy check

      - name: Check Update Trust
        run: python3 scripts/release/gfrelease trust root verify

      # A release tag must carry its reviewed notes, and the version must
      # belong to the 2.1 series.
      - name: Check Version Order
        run: scripts/gfrelease ci check-order

      # `gfrelease ci build-mode` would make a push to release/2.1 a beta;
      # a legacy series has none, so anything but a release tag publishes
      # nothing here.
      - name: Resolve Build Mode
        id: mode
        env:
          BUILD_MODE_INPUT: ${{ github.event.inputs.build_mode }}
        run: |
          set -euo pipefail
          MODE_FILE="$RUNNER_TEMP/build-mode"
          scripts/gfrelease ci build-mode > "$MODE_FILE"
          grep -vE '^(publish_kind|publishes)=' "$MODE_FILE" >> "$GITHUB_OUTPUT"
          KIND="$(sed -n 's/^publish_kind=//p' "$MODE_FILE")"
          if [ "$KIND" != "final" ]; then
            KIND="none"
          fi
          echo "publish_kind=$KIND" >> "$GITHUB_OUTPUT"
          if [ "$KIND" = "final" ]; then
            echo "publishes=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "publish kind on release/2.1: $KIND"

      - name: Note A Skipped Staging
        if: >-
          steps.mode.outputs.publishes == 'true' &&
          vars.R2_STAGING_ENABLED != 'true'
        run: |
          echo "::warning::R2_STAGING_ENABLED is not 'true': this build is" \
            "signed but not staged, and the signing host will not publish it"

  # One leg's failure does not cancel the others (fail-fast: false): a
  # cancelled leg hides whether it would have failed too. The release still
  # needs every leg to succeed, which `needs:` in provenance enforces; there
  # is no continue-on-error anywhere.
  #
  # No macOS 14 leg: GitHub retired that runner, and a DMG built on macOS 15
  # bundles Homebrew libraries that need macOS 15.
  build-qt6:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: "ubuntu-22.04", leg: "linux-x86_64" }
          - { runner: "ubuntu-24.04-arm", leg: "linux-aarch64" }
          - { runner: "macos-15-intel", leg: "macos-15-intel", deploy_target: "15.0" }
          - { runner: "macos-15", leg: "macos-15", deploy_target: "15.0" }
          - { runner: "macos-26-intel", leg: "macos-26-intel", deploy_target: "26.0" }
          - { runner: "macos-26", leg: "macos-26", deploy_target: "26.0" }
          - { runner: "windows-2022", leg: "windows-x86_64" }
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
      ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
      # Lets ccache cache every translation unit that force-includes the CMake
      # PCH, and the .gch itself. Only timestamp and __DATE__-style checks are
      # relaxed; what is hashed into an object is unchanged.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    # The Apple signing material lives in the `macos-signing` environment, not
    # in repository secrets. Only macOS pushes and tags ask for it: pull
    # requests never get signing credentials and build unsigned instead. The
    # environment's deployment branch rule has to allow release/2.1 and v2.1.*.
    environment: ${{ (startsWith(matrix.runner, 'macos') && github.event_name != 'pull_request') && 'macos-signing' || '' }}
    steps:
      - name: Set git to use LF(Windows) or CRLF(MacOS) line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        if: runner.os == 'Windows'  || runner.os == 'macOS'

      # The whole history: CMake derives the version from the tags.
      - uses: actions/checkout@v6
        with:
          lfs: "false"
          submodules: recursive
          fetch-depth: 0

      - name: Setup Signing (macOS)
        shell: bash
        run: |
          echo "CODE_SIGNING_IDENTITY=${{secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY}}" >> $GITHUB_ENV
          # Sign (and notarize) only when the signing environment handed us a
          # certificate; otherwise the macOS build is ad-hoc signed.
          echo "MACOS_SIGNING=${{ secrets.DEVELOP_ID_CERT != '' && '1' || '0' }}" >> $GITHUB_ENV
        if: runner.os == 'macOS'

      # Saved only from pushes, so no pull request can seed an object file
      # into what a release is built from.
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: 2.1-build-${{ matrix.leg }}-${{ env.BUILD_TYPE }}
          # ccache caps each of its 16 subdirectories at 1/16 of this, and a
          # compressed .gch runs past 100 MB, so a smaller limit evicted every
          # PCH result as it was stored.
          max-size: 4G
          save: ${{ github.event_name == 'push' }}

      # Everything compiled from here on touches the cache entries it uses, so
      # "older than this mark" is exactly "not used by this build". The build
      # steps evict those before the post step saves the cache.
      - name: Mark ccache Epoch
        shell: bash
        run: echo "CCACHE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Dependence (Linux)
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential binutils git autoconf automake gettext texinfo
          sudo apt-get -y install gcc g++ ninja-build
          sudo apt-get -y install libarchive-dev libssl-dev libargon2-dev
          sudo apt-get -y install gpgsm libxcb-xinerama0 libxcb-icccm4-dev libcups2-dev libdrm-dev libegl1-mesa-dev
          sudo apt-get -y install libfuse2 libgcrypt20-dev libnss3-dev libpci-dev libpulse-dev libudev-dev libxtst-dev
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-image0 gyp
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-* libxkbcommon-x11-0
          sudo apt-get -y install libwayland-cursor0 libwayland-egl1
        if: runner.os == 'Linux'

      - name: Codesign Configuration (macOS)
        run: |
          APP_CERT_PATH=$RUNNER_TEMP/app_certificate.p12

          # Import the Developer ID certificate into a temporary keychain. A
          # Developer ID build needs no provisioning profile.
          echo -n "${{secrets.DEVELOP_ID_CERT}}" | base64 --decode -o $APP_CERT_PATH

          security create-keychain -p gpgfrontend build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p gpgfrontend build.keychain
          security import $APP_CERT_PATH -k build.keychain -P "${{secrets.DEVELOP_ID_CERT_PWD}}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k gpgfrontend build.keychain
          security set-keychain-settings -lut 3600
          rm -f $APP_CERT_PATH
        if: runner.os == 'macOS' && env.MACOS_SIGNING == '1'

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          cache: "true"
        if: runner.os == 'Linux' || runner.os == 'macOS'

      - name: Install Dependence (macOS)
        run: |
          brew install --formula automake texinfo libarchive googletest create-dmg argon2
        if: runner.os == 'macOS'

      - name: Set up MinGW (Windows)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          update: false
          release: false
          cache: true
          install: >-
            git
            zip
            unzip
            msys2-devel
            base-devel
            msys2-runtime-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-libassuan
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-argon2
        if: runner.os == 'Windows'

      - name: Build GpgME (macOS)
        run: |
          cd ${{github.workspace}}/third_party/gpgme
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-static \
          --disable-shared \
          --enable-silent-rules \
          --disable-dependency-tracking \
          --enable-languages=cl \
          --disable-gpgconf-test \
          --disable-gpg-test \
          --disable-gpgsm-test \
          --disable-g13-test
          make -j$(sysctl -n hw.logicalcpu)
          sudo make install
        if: runner.os == 'macOS'

      - name: Build GpgME (Windows)
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          cd third_party/gpgme
          export CC="ccache gcc"
          export CXX="ccache g++"
          export CFLAGS="${CFLAGS} -Wno-int-conversion -Wno-incompatible-pointer-types"
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-maintainer-mode \
          --enable-static \
          --disable-shared \
          --enable-silent-rules \
          --disable-dependency-tracking \
          --enable-languages=cl \
          --disable-gpgconf-test \
          --disable-gpg-test \
          --disable-gpgsm-test \
          --disable-g13-test \
          --enable-w32-glib
          make -j$(nproc)
          make install
        if: runner.os == 'Windows'

      - name: Cache googletest (Linux)
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/third_party/googletest
          key: gtest-${{ matrix.runner }}-v1.15.2
        if: runner.os == 'Linux'

      - name: Build googletest (Linux)
        run: |
          if [ ! -f "${{github.workspace}}/third_party/googletest/build/build.ninja" ]; then
            rm -rf ${{github.workspace}}/third_party/googletest
            git clone --depth 1 --branch v1.15.2 https://github.com/google/googletest.git ${{github.workspace}}/third_party/googletest
            cd ${{github.workspace}}/third_party/googletest
            mkdir build && cd build
            cmake -G Ninja -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              ..
            ninja
          else
            echo "Reusing cached googletest build"
          fi
          cd ${{github.workspace}}/third_party/googletest/build
          sudo ninja install
        if: runner.os == 'Linux'

      - name: Build GpgFrontend (macOS)
        env:
          DEPLOY_TARGET: ${{ matrix.deploy_target }}
        run: |
          echo "Set MacOS Deployment Target: $DEPLOY_TARGET"

          cmake -B ${{github.workspace}}/build -G Xcode \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${DEPLOY_TARGET} \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON

          # Build unsigned; the bundle is signed after macdeployqt has put the
          # Qt frameworks in place. The *_DEPLOYMENT_TARGET overrides keep newer
          # Xcode from aborting on conflicting deployment targets.
          # ccache, as xcodebuild build settings rather than a CMake launcher,
          # which the Xcode generator ignores. CC/CXX go through a wrapper;
          # LD/LDPLUSPLUS stay the plain driver so links never see a
          # compile-only flag. -fno-pch-timestamp: a .pch restored from the
          # cache would otherwise be refused against this checkout's header
          # mtimes. The index store only adds an uncacheable output.
          WRAP="$RUNNER_TEMP/ccache-xcode"
          mkdir -p "$WRAP"
          REAL_CC="$(xcrun -f clang)"
          REAL_CXX="$(xcrun -f clang++)"
          printf '#!/bin/sh\nexec ccache "%s" -Xclang -fno-pch-timestamp "$@"\n' "$REAL_CC" > "$WRAP/clang"
          printf '#!/bin/sh\nexec ccache "%s" -Xclang -fno-pch-timestamp "$@"\n' "$REAL_CXX" > "$WRAP/clang++"
          chmod +x "$WRAP/clang" "$WRAP/clang++"
          ccache -z

          cd ${{github.workspace}}/build/
          xcodebuild -project ${{github.workspace}}/build/GpgFrontend.xcodeproj \
            -scheme GpgFrontend \
            -configuration "${{env.BUILD_TYPE}}" \
            -archivePath ${{github.workspace}}/build/GpgFrontend.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CC="$WRAP/clang" \
            CXX="$WRAP/clang++" \
            LD="$REAL_CC" \
            LDPLUSPLUS="$REAL_CXX" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            IPHONEOS_DEPLOYMENT_TARGET= \
            TVOS_DEPLOYMENT_TARGET= \
            WATCHOS_DEPLOYMENT_TARGET= \
            XROS_DEPLOYMENT_TARGET= \
            DRIVERKIT_DEPLOYMENT_TARGET=
          ccache -s -v
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s

          # Copy the app out of the archive instead of -exportArchive, which
          # demands a signing identity in the keychain.
          mkdir -p ${{github.workspace}}/build/package
          cp -R ${{github.workspace}}/build/GpgFrontend.xcarchive/Products/Applications/GpgFrontend.app \
            ${{github.workspace}}/build/package/
        if: runner.os == 'macOS'

      - name: Deploy Qt & Code Sign (macOS)
        run: |
          APP=${{github.workspace}}/build/package/GpgFrontend.app

          macdeployqt "$APP" -verbose=2 -always-overwrite

          if [ "${MACOS_SIGNING}" = "1" ]; then
            codesign -s "${CODE_SIGNING_IDENTITY}" \
              -f --deep --options=runtime --timestamp "$APP"
          else
            echo "No signing credentials, signing ad-hoc."
            codesign -s - -f --deep "$APP"
          fi

          codesign --verify --deep --strict --verbose=4 "$APP"
        if: runner.os == 'macOS'

      - name: Package & Sign App Bundle (macOS)
        run: |
          if [ "${MACOS_SIGNING}" = "1" ]; then
            security -v unlock-keychain -p gpgfrontend build.keychain
            DMG_SIGN_ARGS=(--codesign "${CODE_SIGNING_IDENTITY}")
          else
            DMG_SIGN_ARGS=()
          fi
          ditto -c -k --keepParent ${{github.workspace}}/build/package/GpgFrontend.app ${{github.workspace}}/build/GpgFrontend.app.zip
          mkdir ${{github.workspace}}/build/upload-artifact
          DMG_NAME="$(scripts/ci/artifact_name.sh "${{ matrix.leg }}.dmg")"
          create-dmg "${DMG_SIGN_ARGS[@]}" --volicon "${{github.workspace}}/resource/lfs/icns/GpgFrontend.icns" --volname GpgFrontend --app-drop-link 600 185 --window-size 800 400 "${{github.workspace}}/build/upload-artifact/$DMG_NAME" ${{github.workspace}}/build/package/GpgFrontend.app
        if: runner.os == 'macOS'

      - name: Notarize macOS Build (macOS)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "${ASC_API_KEY_P8}" ] || [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ]; then
            echo "The macos-signing environment has no App Store Connect API key; skipping notarization."
            exit 0
          fi
          KEY_PATH=$RUNNER_TEMP/asc_api_key.p8
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          xcrun notarytool submit \
            ${{github.workspace}}/build/GpgFrontend.app.zip \
            --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
          rm -f "$KEY_PATH"
        if: runner.os == 'macOS' && env.MACOS_SIGNING == '1'

      - name: Build GpgFrontend (Linux)
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$LD_LIBRARY_PATH
          cmake -B ${{github.workspace}}/build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DGPGFRONTEND_BUILD_APP_IMAGE=ON \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON
          cmake --build ${{ github.workspace }}/build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel \
            --verbose
          ccache -s -v 2>/dev/null || ccache -s
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s
        if: runner.os == 'Linux'

      - name: Run Unit Tests (Linux)
        # The suite reports failures in its log but always exits 0, so the
        # step surfaces the gtest summary instead of gating on the exit code.
        run: |
          sudo apt-get -y install gnupg
          BIN=$(find ${{github.workspace}}/build/artifacts -type f -name gpgfrontend -perm -u+x | head -n 1)
          if [ -z "$BIN" ]; then
            echo "gpgfrontend binary not found" >&2
            exit 1
          fi
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$(dirname "$BIN")/../lib:$LD_LIBRARY_PATH
          QT_QPA_PLATFORM=offscreen timeout 1200 "$BIN" --test 2>&1 | tee ${{github.workspace}}/build/unit-test.log || true
          {
            echo "### Unit tests (${{ matrix.leg }})"
            echo '```'
            grep -E '^\[  (PASSED|FAILED)  \]' ${{github.workspace}}/build/unit-test.log || echo "no gtest summary found"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        if: runner.os == 'Linux'

      - name: Package App Image (Linux)
        run: |
          QT_PLUGIN_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          echo "Found Qt plugin dir: $QT_PLUGIN_DIR"

          # enter the sqldrivers directory
          cd $QT_PLUGIN_DIR/sqldrivers

          # remove all non-sqlite drivers to reduce the size of the final AppImage
          find . -type f ! -name '*sqlite*' -delete
          ls -l

          # return to the root of the repository
          cd ${{github.workspace}}

          mkdir ${{github.workspace}}/build/upload-artifact
          cd ${{github.workspace}}/build/upload-artifact

          ARCH=$(uname -m)
          if [[ "$ARCH" == "x86_64" ]]; then
            wget -c -nv https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
            mv linuxdeployqt-continuous-x86_64.AppImage linuxdeployqt-continuous.AppImage
            EXTRA_ARGS=""
          elif [[ "$ARCH" == "aarch64" ]]; then
            wget -c -nv https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-aarch64.AppImage
            mv linuxdeployqt-continuous-aarch64.AppImage linuxdeployqt-continuous.AppImage
            mkdir -p ${{github.workspace}}/build/artifacts/AppDir/usr/share/doc/libc6/
            touch ${{github.workspace}}/build/artifacts/AppDir/usr/share/doc/libc6/copyright
            EXTRA_ARGS="-unsupported-allow-new-glibc"
          fi

          chmod u+x linuxdeployqt-continuous.AppImage
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$LD_LIBRARY_PATH
          ./linuxdeployqt-continuous.AppImage \
            ${{github.workspace}}/build/artifacts/AppDir/usr/share/applications/*.desktop \
            $EXTRA_ARGS \
            -no-translations \
            -extra-plugins=iconengines,platforms,sqldrivers/libqsqlite.so \
            -appimage \
            -executable-dir=${{github.workspace}}/build/artifacts/AppDir/usr/lib/modules
          rm -f linuxdeployqt-continuous.AppImage

          # One AppImage per leg, named as every published file is.
          set -- Gpg_Frontend*.AppImage
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one AppImage, got: $*" >&2
            exit 1
          fi
          mv "$1" "$(${{github.workspace}}/scripts/ci/artifact_name.sh "linux-${ARCH}.AppImage")"
          rm -f ./*.zsync
          ls -l
        if: runner.os == 'Linux'

      - name: Build GpgFrontend (Windows)
        shell: msys2 {0}
        env:
          # ccache takes MinGW's `c++.exe` for an unknown compiler and then
          # applies clang's PCH rule: refuse a cached .gch whose headers have a
          # new mtime. CMake rewrites cmake_pch.hxx at every configure, so every
          # PCH and its users missed on every run. It is gcc.
          CCACHE_COMPILERTYPE: gcc
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          mkdir build && cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON \
            ..
          cmake --build . \
            --config ${{ env.BUILD_TYPE }} \
            --parallel \
            --verbose
          ccache -s -v
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s
        if: runner.os == 'Windows'

      - name: Download GnuPG Binary Release (Windows)
        shell: msys2 {0}
        run: scripts/ci/windows/fetch_gnupg.sh
        if: runner.os == 'Windows'

      # The payload the MSI and the portable zip share. build-info.json moves
      # beside it: CI hands it to the release tooling, it is never shipped.
      - name: Stage Payload (Windows)
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          mv build/artifacts/build-info.json build/build-info.json
          cp PrivacyPolicy.md build/artifacts/
          cp README.md build/artifacts/
          cp SECURITY.md build/artifacts/
          cp TRANSLATORS build/artifacts/
          cp COPYING build/artifacts/
          cp gpgfrontend.ico build/artifacts/bin/
          rm -rf build/artifacts/bin/*.a
          rm -rf build/artifacts/bin/modules/*.a
          mv build/artifacts/bin/modules build/artifacts/modules
          cd build
          windeployqt6 --no-translations --force ./artifacts/bin/libgf_core.dll
          windeployqt6 --no-translations --force ./artifacts/bin/libgf_ui.dll
          windeployqt6 --no-translations --force ./artifacts/bin/libgf_test.dll
          windeployqt6 --no-translations --force ./artifacts/bin/GpgFrontend.exe
          for module in ./artifacts/modules/*.dll; do
            windeployqt6 --no-translations --force "$module"
          done
        if: runner.os == 'Windows'

      # Built before ENV.ini is added: an installed GpgFrontend keeps its data
      # in the user profile. Same product as every earlier MSI, so it upgrades
      # an installed 2.1.13 in place (resource/wix/Package.wxs).
      - name: Build MSI (Windows)
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          $name = & bash "$ws/scripts/ci/artifact_name.sh" windows-x86_64.msi
          if ($LASTEXITCODE -ne 0 -or -not $name) { throw "artifact_name.sh failed" }
          & "$ws/scripts/ci/windows/build_msi.ps1" `
            -PayloadDir "$ws/build/artifacts" `
            -BuildInfo "$ws/build/build-info.json" `
            -OutputPath "$ws/build/upload-artifact/$name"
        if: runner.os == 'Windows'

      - name: Package Portable (Windows)
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          NAME="$(scripts/ci/artifact_name.sh windows-x86_64-portable.zip)"
          echo "PortableMode=true" > build/artifacts/bin/ENV.ini
          mkdir -p build/upload-artifact
          cd build/artifacts
          zip -r "../upload-artifact/$NAME" *
          ls -l ../upload-artifact
        if: runner.os == 'Windows'

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpgfrontend-${{ matrix.leg }}
          path: ${{ github.workspace }}/build/upload-artifact/*
          if-no-files-found: error

      - name: Upload Build Info
        uses: actions/upload-artifact@v7
        with:
          name: buildinfo-${{ matrix.leg }}
          path: ${{ github.workspace }}/build/${{ runner.os == 'Windows' && 'build-info.json' || 'artifacts/build-info.json' }}
          if-no-files-found: error

  # 2.1 is the last series that builds with Qt5: an AppImage and a portable
  # zip, flavour "qt5" in release/product.json. Qt5 builds carry no modules.
  build-qt5:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: "ubuntu-22.04", leg: "qt5-linux-x86_64" }
          - { runner: "windows-2022", leg: "qt5-windows-x86_64" }
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
      ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Set git to use LF(Windows) or CRLF(MacOS) line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        if: runner.os == 'Windows'

      # The whole history: CMake derives the version from the tags.
      - uses: actions/checkout@v6
        with:
          lfs: "false"
          submodules: recursive
          fetch-depth: 0

      # Saved only from pushes, so no pull request can seed an object file
      # into what a release is built from.
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: 2.1-build-${{ matrix.leg }}-${{ env.BUILD_TYPE }}
          max-size: 4G
          save: ${{ github.event_name == 'push' }}

      - name: Mark ccache Epoch
        shell: bash
        run: echo "CCACHE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up MinGW (Windows)
        uses: msys2/setup-msys2@v2
        with:
          update: false
          release: false
          cache: true
          install: >-
            git
            zip
            unzip
            msys2-devel
            base-devel
            msys2-runtime-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-libassuan
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-argon2
        if: runner.os == 'Windows'

      - name: Install Dependence (Linux)
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential binutils git autoconf automake gettext texinfo
          sudo apt-get -y install gcc g++ ninja-build
          sudo apt-get -y install libarchive-dev libssl-dev libargon2-dev
          sudo apt-get -y install gpgsm libxcb-xinerama0 libxcb-icccm4-dev libcups2-dev libdrm-dev libegl1-mesa-dev
          sudo apt-get -y install libfuse2 libgcrypt20-dev libnss3-dev libpci-dev libpulse-dev libudev-dev libxtst-dev
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-image0 gyp
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-* libxkbcommon-x11-0
        if: runner.os == 'Linux'

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          cache: "true"
        if: runner.os == 'Linux'

      - name: Build GpgME (Windows)
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          cd third_party/gpgme
          export CC="ccache gcc"
          export CXX="ccache g++"
          export CFLAGS="${CFLAGS} -Wno-int-conversion -Wno-incompatible-pointer-types"
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-maintainer-mode \
          --enable-static \
          --disable-shared \
          --enable-silent-rules \
          --disable-dependency-tracking \
          --enable-languages=cl \
          --disable-gpgconf-test \
          --disable-gpg-test \
          --disable-gpgsm-test \
          --disable-g13-test \
          --enable-w32-glib
          make -j4
          make install
        if: runner.os == 'Windows'

      - name: Cache googletest (Linux)
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/third_party/googletest
          key: gtest-${{ matrix.runner }}-v1.15.2
        if: runner.os == 'Linux'

      - name: Build googletest (Linux)
        run: |
          if [ ! -f "${{github.workspace}}/third_party/googletest/build/build.ninja" ]; then
            rm -rf ${{github.workspace}}/third_party/googletest
            git clone --depth 1 --branch v1.15.2 https://github.com/google/googletest.git ${{github.workspace}}/third_party/googletest
            cd ${{github.workspace}}/third_party/googletest
            mkdir build && cd build
            cmake -G Ninja -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              ..
            ninja
          else
            echo "Reusing cached googletest build"
          fi
          cd ${{github.workspace}}/third_party/googletest/build
          sudo ninja install
        if: runner.os == 'Linux'

      - name: Build GpgFrontend (Windows)
        shell: msys2 {0}
        env:
          # ccache takes MinGW's `c++.exe` for an unknown compiler and applies
          # clang's PCH rule, so every PCH user missed on every run. It is gcc.
          CCACHE_COMPILERTYPE: gcc
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DGPGFRONTEND_QT5_BUILD=ON \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON \
            ..
          cmake --build . --config ${{env.BUILD_TYPE}}  -- -j 4
          ccache -s -v
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s
        if: runner.os == 'Windows'

      - name: Build GpgFrontend (Linux)
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$LD_LIBRARY_PATH
          cmake -B ${{github.workspace}}/build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DGPGFRONTEND_QT5_BUILD=ON \
            -DGPGFRONTEND_BUILD_APP_IMAGE=ON \
            -DGPGFRONTEND_LINK_GPGME_INTO_CORE=ON
          cmake --build ${{github.workspace}}/build --config ${{ env.BUILD_TYPE }} -- -v
          ccache -s -v 2>/dev/null || ccache -s
          # Keep only what this build used, so the saved cache stays the
          # working set instead of growing toward max-size run after run.
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_EPOCH + 60 ))s"
          ccache -s
        if: runner.os == 'Linux'

      - name: Run Unit Tests (Linux)
        # The suite reports failures in its log but always exits 0, so the
        # step surfaces the gtest summary instead of gating on the exit code.
        run: |
          sudo apt-get -y install gnupg
          BIN=$(find ${{github.workspace}}/build/artifacts -type f -name gpgfrontend -perm -u+x | head -n 1)
          if [ -z "$BIN" ]; then
            echo "gpgfrontend binary not found" >&2
            exit 1
          fi
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$(dirname "$BIN")/../lib:$LD_LIBRARY_PATH
          QT_QPA_PLATFORM=offscreen timeout 1200 "$BIN" --test 2>&1 | tee ${{github.workspace}}/build/unit-test.log || true
          {
            echo "### Unit tests (${{ matrix.leg }})"
            echo '```'
            grep -E '^\[  (PASSED|FAILED)  \]' ${{github.workspace}}/build/unit-test.log || echo "no gtest summary found"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
        if: runner.os == 'Linux'

      - name: Package App Image (Linux)
        run: |
          mkdir ${{github.workspace}}/build/upload-artifact
          cd ${{github.workspace}}/build/upload-artifact
          wget -c -nv https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod u+x linuxdeployqt-continuous-x86_64.AppImage
          export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:$LD_LIBRARY_PATH
          ./linuxdeployqt-continuous-x86_64.AppImage \
            ${{github.workspace}}/build/artifacts/AppDir/usr/share/applications/*.desktop \
            -no-translations \
            -extra-plugins=iconengines,platforms \
            -appimage \
            -executable-dir=${{github.workspace}}/build/artifacts/AppDir/usr/lib/modules
          rm -f linuxdeployqt-continuous-x86_64.AppImage

          # One AppImage per leg, named as every published file is.
          set -- Gpg_Frontend*.AppImage
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one AppImage, got: $*" >&2
            exit 1
          fi
          mv "$1" "$(${{github.workspace}}/scripts/ci/artifact_name.sh qt5-linux-x86_64.AppImage)"
          rm -f ./*.zsync
          ls -l
        if: runner.os == 'Linux'

      - name: Download GnuPG Binary Release (Windows)
        shell: msys2 {0}
        run: scripts/ci/windows/fetch_gnupg.sh
        if: runner.os == 'Windows'

      - name: Package Portable (Windows)
        shell: msys2 {0}
        run: |
          cd $(cygpath -u "${{github.workspace}}")
          NAME="$(scripts/ci/artifact_name.sh qt5-windows-x86_64-portable.zip)"
          mv build/artifacts/build-info.json build/build-info.json
          cp PrivacyPolicy.md build/artifacts/
          cp README.md build/artifacts/
          cp SECURITY.md build/artifacts/
          cp TRANSLATORS build/artifacts/
          cp COPYING build/artifacts/
          cp gpgfrontend.ico build/artifacts/bin/
          rm -rf build/artifacts/bin/*.a
          echo "PortableMode=true" > build/artifacts/bin/ENV.ini
          cd build
          windeployqt-qt5 --no-translations --force ./artifacts/bin/libgf_core.dll
          windeployqt-qt5 --no-translations --force ./artifacts/bin/libgf_ui.dll
          windeployqt-qt5 --no-translations --force ./artifacts/bin/libgf_test.dll
          windeployqt-qt5 --no-translations --force ./artifacts/bin/GpgFrontend.exe
          mkdir -p upload-artifact
          cd artifacts
          zip -r "../upload-artifact/$NAME" *
          ls -l ../upload-artifact
        if: runner.os == 'Windows'

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpgfrontend-${{ matrix.leg }}
          path: ${{ github.workspace }}/build/upload-artifact/*
          if-no-files-found: error

      - name: Upload Build Info
        uses: actions/upload-artifact@v7
        with:
          name: buildinfo-${{ matrix.leg }}
          path: ${{ github.workspace }}/build/${{ runner.os == 'Windows' && 'build-info.json' || 'artifacts/build-info.json' }}
          if-no-files-found: error

  # Collects every leg into one release candidate: SHA256SUMS.txt over the
  # files, signed with this workflow's Sigstore identity. Needs every leg, Qt5
  # included, so a release never goes out with one missing.
  provenance:
    needs: [setup, build-qt6, build-qt5]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.publishes == 'true'
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: in/
          pattern: gpgfrontend-*

      - name: Download Build Info
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: in/
          pattern: buildinfo-*

      - name: Stage Release Candidate
        env:
          ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
        run: |
          set -euo pipefail
          scripts/gfrelease candidate stage \
            --artifacts in/ \
            --out candidate/ \
            --version "$ARTIFACT_VERSION"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign Manifest
        run: |
          set -euo pipefail
          COSIGN_EXPERIMENTAL=1 cosign sign-blob \
            --yes \
            --bundle candidate/SHA256SUMS.txt.sigstore.json \
            candidate/SHA256SUMS.txt

      - name: Upload Release Candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: candidate/*
          if-no-files-found: error

  # Hands the release candidate exactly as provenance signed it to the private
  # staging bucket, and nothing else. A version tag waits there for the
  # maintainer's offline stage (gfrelease stable), which signs it with their
  # OpenPGP key and the Windows packages with their certificate, after
  # verifying the Sigstore bundle against this workflow, ref and commit.
  #
  # Off until the repository variable R2_STAGING_ENABLED is "true"; the
  # `r2-staging` environment holds R2_STAGING_ACCESS_KEY_ID,
  # R2_STAGING_SECRET_ACCESS_KEY, R2_ENDPOINT and R2_STAGING_BUCKET, and its
  # deployment rule has to allow v2.1.* tags.
  stage:
    needs: [setup, provenance]
    if: >-
      needs.setup.outputs.publishes == 'true' &&
      vars.R2_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: r2-staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          persist-credentials: false

      - name: Download Release Candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate
          path: candidate/

      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q rclone

      - name: Upload To Staging
        env:
          RCLONE_CONFIG: /dev/null
          RCLONE_CONFIG_STAGING_TYPE: s3
          RCLONE_CONFIG_STAGING_PROVIDER: Cloudflare
          RCLONE_CONFIG_STAGING_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_STAGING_ACCESS_KEY_ID: ${{ secrets.R2_STAGING_ACCESS_KEY_ID }}
          RCLONE_CONFIG_STAGING_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_STAGING_NO_CHECK_BUCKET: "true"
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          VERSION: ${{ needs.setup.outputs.version }}
          ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
        run: |
          set -euo pipefail
          : "${RCLONE_CONFIG_STAGING_ENDPOINT:?the r2-staging environment has no R2_ENDPOINT secret}"
          : "${STAGING_BUCKET:?the r2-staging environment has no R2_STAGING_BUCKET secret}"
          python3 scripts/release/gfrelease stage \
            --candidate candidate \
            --staging "staging:${STAGING_BUCKET}" \
            --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" \
            --version "$VERSION" \
            --filesafe "$ARTIFACT_VERSION" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
