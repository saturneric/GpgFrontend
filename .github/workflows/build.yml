# Layout
# ------
#   setup           checks the pipeline itself, decides the build mode once
#   build-linux     AppImage, x86_64 and aarch64, installed and portable
#   build-windows   MSI (installed) and ZIP (portable)
#   build-android   unsigned APK and AAB  -> sign-android -> play-upload
#   build-macos     unsigned bundle       -> sign-macos   -> macos-smoke
#   provenance      signs the release candidate after every platform check
#   stage           hands it to the signing host, which verifies, signs and
#                   publishes it (scripts/release/gfrelease)
#
# The work itself lives in scripts/ci/<platform>/, where each step's
# rationale sits beside its code. A job here only says what runs, in which
# order, with which inputs.
#
# Signing never shares a runner with a build: sign-macos is the shared
# .github/workflows/sign-apple.yml, which explains the trust boundary and
# lists the `macos-signing` environment's secrets. Once that flow is
# verified, these repository secrets can be deleted:
#   APPLE_DEVELOPER_ID, APPLE_DEVELOPER_TEAM_ID, APPLE_DEVELOPER_ID_SECRET
#     -- replaced by the App Store Connect API key;
#   DEVELOPER_ID_PROVISIONING_PROFILE_DATA, DEVELOPER_ID_PROVISIONING_PROFILE_UUID
#     -- the Developer ID entitlements are hardened-runtime exceptions only and
#        need no provisioning profile.

name: Build

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  pull_request:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - release
      # A Windows portable build with the hidden --screenshot mode compiled in,
      # for rendering the user manual's images. Never a release: setup refuses
      # it together with build_mode=release, and CMake refuses it together
      # with a stable build.
      screenshot:
        description: "Build the screenshot-mode binary (Windows portable only)"
        required: false
        default: false
        type: boolean

# Supersede in-flight work: a new commit on a ref makes the run already going
# for that ref obsolete. Grouping by ref keeps each PR, main, each release/X.Y
# branch and each v* tag in its own lane, so a tag build is never cancelled by unrelated activity.
# A screenshot build has a lane of its own beside its ref's: it is a tool for
# the manual, not a newer nightly or release, so it neither cancels nor is
# cancelled by one; a newer screenshot dispatch still supersedes an older one.
# Cancelling a run mid-signing is safe: the signing cleanup steps are
# `if: always()`, which still fires on cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.screenshot && '-screenshot' || '' }}
  cancel-in-progress: true

# Least privilege by default: no job is granted contents: write. Nothing here
# publishes a release; the signing host promotes what `stage` hands it.
permissions:
  contents: read

jobs:
  # Cheap checks of the pipeline itself, before any runner compiles anything:
  # the failures they catch otherwise cost a full matrix. And the build mode,
  # decided once here and handed to every build job as job outputs.
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.mode.outputs.version }}
      artifact_version: ${{ steps.mode.outputs.artifact_version }}
      build_number: ${{ steps.mode.outputs.build_number }}
      build_type: ${{ steps.mode.outputs.build_type }}
      gpgfrontend_build_mode: ${{ steps.mode.outputs.gpgfrontend_build_mode }}
      screenshot_cmake_flag: ${{ steps.mode.outputs.screenshot_cmake_flag }}
      macos_runners: ${{ steps.mode.outputs.macos_runners }}
      # Whether this run signs and stages what it builds, and as what:
      # nightly-main, beta, final or none (scripts/ci/build_mode.sh).
      # Every signing, provenance, staging and upload job gates on it, so a
      # base tag (vX.Y.0-alpha.0) or a stray prerelease tag publishes nothing.
      publish_kind: ${{ steps.mode.outputs.publish_kind }}
      publishes: ${{ steps.mode.outputs.publishes }}
      # main's nightlies, and the finals whose build number is above main's:
      # Play refuses any versionCode not above every one it holds
      # (scripts/ci/build_mode.sh).
      play_upload: ${{ steps.mode.outputs.play_upload }}
    steps:
      # The whole history and every tag: the version is derived from them
      # (cmake/GitVersion.cmake), and a shallow clone has neither.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          fetch-depth: 0

      # Every `run:` block is its own process. A variable set in one step is
      # gone by the next, and neither shell says so usefully: bash under
      # `set -u` at least aborts, while PowerShell expands an undefined
      # variable to the EMPTY STRING -- which once turned `--expect-count
      # "$EXPECTED"` into a gate expecting nothing.
      - name: Check Workflow Steps Define What They Read
        run: python3 scripts/check_workflow_steps.py

      # What the update chain's tests drive for real (scripts/tests/
      # test_gfrelease.py, stable releases included: Authenticode on a real
      # MSI), listed once in scripts/release/tools.txt.
      - name: Install Release Tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          grep -v '^#' scripts/release/tools.txt | awk 'NF { print $2 }' |
            sort -u | xargs sudo apt-get install -y -q

      # The release-candidate rules, the update chain end to end and the
      # workflow structure they rely on. Here so a pull request runs them:
      # provenance and staging only run where a failure costs a release.
      # GF_REQUIRE_RELEASE_TOOLS: a chain test skipped here is a chain
      # untested, so a missing tool fails the run.
      - name: Test Release Candidate Rules
        env:
          GF_REQUIRE_RELEASE_TOOLS: "1"
        run: python3 -m unittest discover -s scripts/tests

      # The nightly chain once more, as the signing host runs it: through
      # the gfrelease command line, to a local HTTPS mirror, verified deep.
      - name: Rehearse The Update Chain
        run: scripts/release/rehearse.sh "$RUNNER_TEMP/rehearsal"

      # release/policy.toml is the one statement of which series exist and in
      # what state; SECURITY.md's table is generated from it.
      - name: Check Release Policy
        run: |
          set -euo pipefail
          python3 scripts/release/policy.py check
          python3 scripts/release/policy.py check-security

      # A nightly must sort after every release on its line, and a release tag
      # must carry its reviewed notes. Fails main when the base tag of the
      # last cut was not pushed (scripts/release/cut.sh).
      - name: Check Version Order
        run: python3 scripts/release/check_order.py

      - name: Resolve Build Mode
        id: mode
        env:
          BUILD_MODE_INPUT: ${{ github.event.inputs.build_mode }}
          SCREENSHOT_INPUT: ${{ inputs.screenshot }}
        run: |
          set -euo pipefail
          scripts/ci/build_mode.sh >> "$GITHUB_OUTPUT"
          # The macOS legs, named once: build-macos, sign-macos and
          # macos-smoke must run the same list. macOS ships only the installed
          # flavour: the app is a notarized bundle in /Applications, so a
          # portable layout has no meaning there.
          echo 'macos_runners=["macos-15-intel", "macos-15", "macos-26-intel", "macos-26"]' >> "$GITHUB_OUTPUT"

      # A build that would publish, with the hand-over to the signing host
      # switched off: the run still ends green, so say so where it shows.
      - name: Note A Skipped Staging
        if: >-
          steps.mode.outputs.publishes == 'true' &&
          vars.R2_STAGING_ENABLED != 'true'
        run: |
          echo "::warning::R2_STAGING_ENABLED is not 'true': this build is" \
            "signed but not staged, and the signing host will not publish it"

  # One leg's failure does not cancel the others (fail-fast: false) in any
  # build matrix: a cancelled leg hides whether it would have failed too. The
  # release still needs every leg to succeed, which `needs:` in provenance
  # enforces; there is no continue-on-error anywhere.
  #
  # Portable vs installed is a compile-time decision (GPGFRONTEND_BUILD_FLAVOR
  # decides where the profile, and with it the user's keys, lives), so each
  # flavour needs its own configure and build. They run as separate legs on
  # purpose: the generated build headers land in the source tree, so two
  # flavours cannot share one checkout.
  #
  # Every leg uploads exactly `gpgfrontend-<leg>` and `buildinfo-<leg>`, with
  # the same <leg>. That exact name is how provenance pairs them, so a new leg
  # needs nothing else from the release path. Build info is a separate
  # artifact so the deliverable artifact stays flat.
  build-linux:
    needs: setup
    # A screenshot build is one Windows portable leg and nothing else.
    if: ${{ !inputs.screenshot }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-linux.yml
    with:
      build_type: ${{ needs.setup.outputs.build_type }}
      gpgfrontend_build_mode: ${{ needs.setup.outputs.gpgfrontend_build_mode }}
      artifact_version: ${{ needs.setup.outputs.artifact_version }}

  build-windows:
    needs: setup
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows.yml
    with:
      build_type: ${{ needs.setup.outputs.build_type }}
      gpgfrontend_build_mode: ${{ needs.setup.outputs.gpgfrontend_build_mode }}
      artifact_version: ${{ needs.setup.outputs.artifact_version }}
      screenshot_cmake_flag: ${{ needs.setup.outputs.screenshot_cmake_flag }}
      # A boolean even on a push, where the dispatch input is unset.
      screenshot: ${{ inputs.screenshot == true }}

  # The Android application, cross-built with the toolchain it is released
  # with: Qt 6.10.3 for Android (the oldest open-source Qt whose Android
  # libraries are 16 KB-page aligned and target API 36), NDK r27c and JDK 17,
  # as Qt 6.10 documents. The SDK and JDK are the runner image's own; the NDK
  # is installed at the exact version and Qt with the pinned install-qt-action
  # the desktop jobs use.
  #
  # Like build-macos, it holds no secrets: the APK and the app bundle (AAB)
  # leave here unsigned, after the checks that need the build tree, and are
  # signed by sign-android below; play-upload signs the arm64-v8a bundle again
  # with the Play upload key.
  build-android:
    # Behind setup like every build: its pipeline checks fail before any
    # runner compiles anything.
    needs: setup
    if: ${{ !inputs.screenshot }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-android.yml

  # Signs the APK and the AAB with the release key. Every APK is signed by the
  # same key, so a newer build installs over an older one on a phone. The APK
  # takes apksigner (Android 11+ wants its v2+ schemes); the AAB takes
  # jarsigner, the only signer for a bundle. Like sign-macos: no checkout, no
  # build, and nothing read from the artifact but the two packages.
  sign-android:
    needs: [setup, build-android]
    # Two independent gates on which refs may ever request the signing key: this
    # condition, and the deployment branch rule on the environment below. Never
    # a pull request, never a branch other than main or release/X.Y, never a
    # tag other than a release vX.Y.Z.
    if: needs.setup.outputs.publishes == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: ["arm64-v8a", "x86_64"]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The keystore lives in this environment, not in repository secrets.
    # Maintainer: configure its deployment branch rule to allow only `main`,
    # `release/[0-9]*.[0-9]*` and tags matching `v[0-9]*.[0-9]*.[0-9]*`, as
    # defence in depth behind the `if:` above (a final tag never has a "-";
    # the rule cannot say so, the `if:` does).
    environment: android-signing
    steps:
      # Runs before anything else, and only tests for emptiness; no value is
      # printed, and an unset secret arrives as the empty string.
      - name: Preflight Check Signing Credentials
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ANDROID_KEYSTORE:-}" ] || missing="$missing ANDROID_KEYSTORE"
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing="$missing ANDROID_KEY_PASSWORD"

          if [ -n "$missing" ]; then
            echo "The 'android-signing' environment is missing:" >&2
            for name in $missing; do echo "  - $name" >&2; done
            echo >&2
            echo "Set them under Settings > Environments > android-signing." >&2
            echo "ANDROID_KEYSTORE is the keystore file (PKCS#12 or JKS), base64" >&2
            echo "encoded on one line (base64 -w0 release.p12). Keep that file:" >&2
            echo "an installed app only takes updates signed by the same key." >&2
            exit 1
          fi
          echo "all four signing credentials are present"

      - name: Install Build Tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"

      - name: Download Unsigned Packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-android-${{ matrix.arch }}
          path: ${{ runner.temp }}/unsigned

      # The names come from GitHub context and the matrix, never from the
      # artifact, as in sign-macos. One step, so the keystore is written once.
      # jarsigner without -strict: a self-signed release certificate is
      # normal on Android, and -strict fails on its chain warning.
      - name: Sign And Verify The APK And AAB
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          ks="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$ks"
          out="$RUNNER_TEMP/upload-artifact"
          mkdir -p "$out"
          apk="$out/GpgFrontend-${ARTIFACT_VERSION}-android-${ARCH}.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/unsigned/unsigned.apk"
          rm -f "$apk.idsig"
          "$bt/apksigner" verify --verbose --print-certs "$apk" |
            grep -E "^Verified using|^Signer #1 certificate (DN|SHA-256)"

          # The bundle is not a release download: it goes up apart, below.
          bundle_out="$RUNNER_TEMP/upload-bundle"
          mkdir -p "$bundle_out"
          aab="$bundle_out/GpgFrontend-${ARTIFACT_VERSION}-android-${ARCH}.aab"
          jarsigner -keystore "$ks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -digestalg SHA-256 \
            -signedjar "$aab" "$RUNNER_TEMP/unsigned/unsigned.aab" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$aab" | grep -x "jar verified."

          # Both packages by the one key, compared in apksigner's notation.
          apk_cert="$("$bt/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          aab_cert="$(keytool -printcert -jarfile "$aab" |
            sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "AAB signer certificate SHA-256: $aab_cert"
          if [ -z "$apk_cert" ] || [ "$apk_cert" != "$aab_cert" ]; then
            echo "::error::the APK and the AAB were not signed by the same key" >&2
            exit 1
          fi

      # The release takes the APK alone.
      - name: Upload Signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpgfrontend-android-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload-artifact/*
          if-no-files-found: error

      # NOT "gpgfrontend-*": the signed bundle stays with the run and never
      # reaches the GitHub release.
      - name: Upload Signed AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-android-aab-${{ matrix.arch }}
          path: ${{ runner.temp }}/upload-bundle/*
          if-no-files-found: error

  # Compiles and deploys the macOS bundle. Deliberately holds no secrets: the
  # Developer ID key must never share a runner with brew, cargo build scripts,
  # recursive submodules or third-party build actions. The bundle leaves here
  # unsigned and is signed by sign-macos below.
  build-macos:
    needs: setup
    # Nothing of macOS in a screenshot build; sign-macos and macos-smoke
    # depend on this job and are skipped with it.
    if: ${{ !inputs.screenshot }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos.yml
    with:
      build_type: ${{ needs.setup.outputs.build_type }}
      gpgfrontend_build_mode: ${{ needs.setup.outputs.gpgfrontend_build_mode }}
      runners: ${{ needs.setup.outputs.macos_runners }}

  # The Developer ID signature, notarization and disk image. The job itself,
  # its trust boundary and the `macos-signing` environment are documented in
  # sign-apple.yml.
  sign-macos:
    needs: [setup, build-macos]
    # Two independent gates on which refs may ever request the signing key: this
    # condition, and the deployment branch rule on the environment. Never a
    # pull request, never a branch other than main or release/X.Y, never a
    # tag other than a release vX.Y.Z.
    if: needs.setup.outputs.publishes == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/sign-apple.yml
    with:
      target: developer-id
      runners: ${{ needs.setup.outputs.macos_runners }}
      artifact_version: ${{ needs.setup.outputs.artifact_version }}
    # Named one by one, never inherited: this target's credentials only. A
    # secret set in the `macos-signing` environment wins over the same name
    # passed here, so either place works.
    secrets:
      DEVELOP_ID_CERT: ${{ secrets.DEVELOP_ID_CERT }}
      DEVELOP_ID_CERT_PWD: ${{ secrets.DEVELOP_ID_CERT_PWD }}
      DEVELOPER_ID_CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

  # Does the thing we ship actually work. Deliberately the dmg from sign-macos
  # -- signed, notarized, stapled -- and not the bundle build-macos produced,
  # because every step between those two can break loading. Unprivileged: no
  # Apple credentials, nothing to sign. It only consumes.
  macos-smoke:
    needs: [setup, sign-macos]
    if: needs.setup.outputs.publishes == 'true'
    strategy:
      # Same legs as sign-macos: an arm64 bundle cannot be smoke-tested on an
      # Intel runner, and a module that loads on one may not on the other.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.macos_runners) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          # Nothing here talks to the repository: no token left on disk.
          persist-credentials: false

      - name: Download Build Info
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: buildinfo-${{ matrix.os }}-installed
          path: buildinfo/

      - name: Download Signed Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gpgfrontend-${{ matrix.os }}-installed
          path: signed/

      - name: Mount, Assess And Launch
        run: scripts/ci/macos/smoke.sh signed buildinfo

  # Public build provenance, and the ONLY job in this workflow with
  # `id-token: write`.
  #
  # It turns the final, verified artifacts of every leg into the release
  # candidate: the deliverables and `SHA256SUMS.txt`, the canonical list of
  # what the release is. Nothing about the builds themselves is published.
  # It signs that one manifest and nothing else; the signature covers every
  # file the manifest hashes.
  #
  # Keyless Sigstore: Fulcio issues a short-lived certificate bound to this
  # job's OIDC identity, the signature and certificate go into the public Rekor
  # transparency log, and the private key exists for seconds and is never
  # written down. There is no signing secret here to steal or rotate.
  #
  # What this establishes and what it does not, stated plainly because the two
  # are easy to conflate:
  #
  #   it DOES     prove these exact bytes were produced by this workflow, at
  #               this commit, in this repository, and say so in a public log
  #               anyone can query without asking us
  #
  #   it does NOT authenticate a module descriptor, replace Apple code signing
  #               or Windows Authenticode, or participate in module loading at
  #               all. Runtime verification is offline and depends on none of
  #               this: a user with no network still gets every guarantee the
  #               Host makes about its modules.
  #
  # It needs macos-smoke, not only sign-macos: nothing is signed before every
  # platform check has passed on the bytes being signed.
  #
  # Nothing in here knows a platform. Legs are paired by artifact name
  # (`gpgfrontend-<leg>` with `buildinfo-<leg>`), so adding a leg changes
  # nothing below.
  #
  # The only job that can mint an identity token, and it can write nothing:
  # what it signs leaves through `stage`, and is published by the signing host.
  provenance:
    needs: [setup, build-linux, build-windows, sign-macos, macos-smoke, sign-android]
    runs-on: ubuntu-latest
    # No status function, so success() is implied: every job in `needs` must
    # have succeeded, not merely finished.
    # main and release/X.Y (nightlies) and release tags vX.Y.Z (a stable
    # release, signed offline after it is staged): the signature names the
    # ref, and the signers pin it.
    if: needs.setup.outputs.publishes == 'true'
    timeout-minutes: 30
    permissions:
      # The identity token Fulcio exchanges for a certificate. Nothing else.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          persist-credentials: false

      # The release-candidate rules ran in setup, on this same commit.

      # Not merged: one directory per artifact, so the leg that produced each
      # file is known and two legs shipping the same file name is an error
      # instead of a silent overwrite.
      - name: Download Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: in/
          pattern: gpgfrontend-*

      - name: Download Build Info
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: in/
          pattern: buildinfo-*

      - name: Stage Release Candidate
        run: |
          set -euo pipefail
          python3 ./scripts/release_candidate.py stage \
            --artifacts in/ \
            --out candidate/

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign Manifest
        run: |
          set -euo pipefail
          COSIGN_EXPERIMENTAL=1 cosign sign-blob \
            --yes \
            --bundle candidate/SHA256SUMS.txt.sigstore.json \
            candidate/SHA256SUMS.txt

      # The immutability boundary. Nothing writes to candidate/ after the
      # signature, and the artifact is uploaded once: upload-artifact refuses a
      # second artifact of the same name in a run unless told to overwrite,
      # which this never is.
      - name: Upload Release Candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: candidate/*
          if-no-files-found: error

  # Hands a build to its signers: the release candidate exactly as provenance
  # signed it goes to the private staging bucket, and nothing else. main's
  # nightly and a release/X.Y branch's beta are promoted from there by the
  # signing host (scripts/release/gfrelease promote); a version tag waits
  # for the maintainer's offline
  # stage (gfrelease stable), which signs it with their OpenPGP key and the
  # Windows installers with their certificate. Both verify the Sigstore
  # bundle against this workflow, ref and commit first. This job can write
  # staging and nothing else, and staging is never served.
  #
  # Off until the maintainer sets the repository variable R2_STAGING_ENABLED
  # to "true" (a variable, not a secret: a job's `if:` cannot read secrets)
  # and gives the `r2-staging` environment the secrets
  #   R2_STAGING_ACCESS_KEY_ID, R2_STAGING_SECRET_ACCESS_KEY  an R2 token with
  #                                 Object Read & Write on the staging bucket only
  #   R2_ENDPOINT                   https://<account>.r2.cloudflarestorage.com
  #   R2_STAGING_BUCKET             the staging bucket's name
  stage:
    needs: [setup, provenance]
    if: >-
      needs.setup.outputs.publishes == 'true' &&
      vars.R2_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: r2-staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          persist-credentials: false

      - name: Download Release Candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-candidate
          path: candidate/

      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q rclone

      # rclone takes the remote from its environment; nothing is written to a
      # config file. The version and its file-safe name are setup's, which
      # derived them from git; the signing host derives them again.
      - name: Upload To Staging
        env:
          RCLONE_CONFIG: /dev/null
          RCLONE_CONFIG_STAGING_TYPE: s3
          RCLONE_CONFIG_STAGING_PROVIDER: Cloudflare
          RCLONE_CONFIG_STAGING_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_STAGING_ACCESS_KEY_ID: ${{ secrets.R2_STAGING_ACCESS_KEY_ID }}
          RCLONE_CONFIG_STAGING_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGING_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_STAGING_NO_CHECK_BUCKET: "true"
          STAGING_BUCKET: ${{ secrets.R2_STAGING_BUCKET }}
          VERSION: ${{ needs.setup.outputs.version }}
          ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
        run: |
          set -euo pipefail
          # Without an endpoint rclone talks to AWS S3, and its 403 hides why.
          : "${RCLONE_CONFIG_STAGING_ENDPOINT:?the r2-staging environment has no R2_ENDPOINT secret}"
          : "${STAGING_BUCKET:?the r2-staging environment has no R2_STAGING_BUCKET secret}"
          python3 scripts/release/gfrelease stage \
            --candidate candidate \
            --staging "staging:${STAGING_BUCKET}" \
            --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" \
            --version "$VERSION" \
            --filesafe "$ARTIFACT_VERSION" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # Puts the arm64-v8a app bundle on Google Play's internal testing track, rolled
  # out to the testers at once, as soon as sign-android has signed it: it
  # does not wait for provenance, which guards the public update channel and
  # not the testers.
  #   - a push to main  -> named nightly-<artifact version>.
  #   - a version tag   -> named after the tag. Promoting it beyond the
  #     testers is done by hand in Play Console.
  # arm64-v8a alone, as Play wants one bundle per release and phones are ARM;
  # x86_64 is on the update channel.
  #
  # Play App Signing re-signs what users get, so the bundle is signed here
  # with the upload key, not the release key that signs the APKs: it is the
  # unsigned bundle from build-android, signed again for this one purpose.
  #
  # Maintainer, once, before this can pass:
  #   - create the app (com.bktus.gpgfrontend) in Play Console, enable Play
  #     App Signing, and upload a first bundle there by hand: the API cannot
  #     create an app;
  #   - register the upload key's certificate as the app's upload key;
  #   - grant a Google Cloud service account "Release to testing tracks" for
  #     the app, and put its JSON key in the environment below.
  # While the app has never been published, Play takes only draft releases:
  # pass --status draft until then.
  play-upload:
    needs: [setup, sign-android]
    # main's nightlies and the stable releases above main's build number;
    # never a release/X.Y build, which Play would take as newer than the next
    # main build, nor a fix of an older series, whose versionCode Play
    # refuses. build_mode.sh decides all of it (play_upload is only ever true
    # for nightly-main and final).
    if: needs.setup.outputs.play_upload == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The upload key and the service-account key live in this environment.
    # Maintainer: configure its deployment rule to allow only `main` and tags
    # matching `v[0-9]*.[0-9]*.[0-9]*`.
    environment: google-play
    steps:
      - name: Preflight Check Play Credentials
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${PLAY_UPLOAD_KEYSTORE:-}" ] || missing="$missing PLAY_UPLOAD_KEYSTORE"
          [ -n "${PLAY_UPLOAD_KEYSTORE_PASSWORD:-}" ] || missing="$missing PLAY_UPLOAD_KEYSTORE_PASSWORD"
          [ -n "${PLAY_UPLOAD_KEY_ALIAS:-}" ] || missing="$missing PLAY_UPLOAD_KEY_ALIAS"
          [ -n "${PLAY_UPLOAD_KEY_PASSWORD:-}" ] || missing="$missing PLAY_UPLOAD_KEY_PASSWORD"
          [ -n "${PLAY_SERVICE_ACCOUNT_JSON:-}" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"

          if [ -n "$missing" ]; then
            echo "The 'google-play' environment is missing:" >&2
            for name in $missing; do echo "  - $name" >&2; done
            echo >&2
            echo "Set them under Settings > Environments > google-play." >&2
            echo "PLAY_UPLOAD_KEYSTORE is the upload keystore (PKCS#12 or JKS)," >&2
            echo "base64 encoded on one line. PLAY_SERVICE_ACCOUNT_JSON is the" >&2
            echo "service account's JSON key file, as Google Cloud gives it." >&2
            exit 1
          fi
          echo "all five Play credentials are present"

      # The upload script only; nothing of the build.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          sparse-checkout: scripts/android
          persist-credentials: false

      - name: Download Unsigned Bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-android-arm64-v8a
          path: ${{ runner.temp }}/unsigned

      - name: Sign The Bundle With The Upload Key
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          ks="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$ks"
          aab="$RUNNER_TEMP/play/GpgFrontend-${ARTIFACT_VERSION}-android-arm64-v8a.aab"
          mkdir -p "$(dirname "$aab")"
          jarsigner -keystore "$ks" \
            -storepass:env PLAY_UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env PLAY_UPLOAD_KEY_PASSWORD \
            -digestalg SHA-256 \
            -signedjar "$aab" "$RUNNER_TEMP/unsigned/unsigned.aab" \
            "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify "$aab" | grep -x "jar verified."
          keytool -printcert -jarfile "$aab" | grep -E "^[[:space:]]*SHA256:"

      # The ref was already checked by the job's `if:`: a release tag, or
      # main. The versionCode is the build number cmake/GitVersion.cmake
      # derived; Play must not already hold one as great, or no phone updates.
      - name: Upload To The Internal Track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ARTIFACT_VERSION: ${{ needs.setup.outputs.artifact_version }}
          BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="$GITHUB_REF_NAME"
          else
            name="nightly-${ARTIFACT_VERSION}"
          fi
          python3 -I scripts/android/play_upload.py \
            --package com.bktus.gpgfrontend \
            --bundle "$RUNNER_TEMP/play/GpgFrontend-${ARTIFACT_VERSION}-android-arm64-v8a.aab" \
            --track internal \
            --release-name "$name" \
            --version-code "$BUILD_NUMBER"
