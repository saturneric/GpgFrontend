#
# The sandboxed App Store package. Same split as build.yml: `build-mas`
# compiles and deploys the bundle and never sees a secret; `sign-mas` is the
# shared .github/workflows/sign-apple.yml, which documents the trust boundary
# and the `mas-signing` environment.
#
# Repository secrets this workflow no longer reads, and which can be deleted
# once the `mas-signing` environment is the only holder:
#   DEVELOP_ID_CERT / DEVELOP_ID_CERT_PWD -- the Developer ID certificate was
#     once imported here without ever signing anything; build.yml's
#     `macos-signing` environment is its only legitimate holder.
#   MAS_PROVISIONING_PROFILE_UUID -- only ever used to name a file.
#   GPGFRONTEND_XCODE_TEAM_ID -- the team id is not secret (it is committed in
#     resource/entitlements/Sandbox.entitlements) and the unsigned archive
#     does not need it.

name: Build MAS Sandbox Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "resource/lfs/locale/**"
      - "**.md"

  # No pull_request trigger on purpose: the package is only worth building
  # where it can be signed, and a pull request cannot read the signing secrets.
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "release"
        type: choice
        options:
          - nightly
          - release

# Supersede in-flight work: a new commit on a ref makes the run already going
# for that ref obsolete. Cancelling mid-signing is safe: the signing cleanup
# step is `if: always()`, which still fires on cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Nothing here publishes a release.
permissions:
  contents: read

env:
  # No pull_request trigger, so never RelWithDebInfo.
  BUILD_TYPE: Release

jobs:
  # Compiles and deploys the sandboxed bundle with the same scripts as
  # build.yml's build-macos. Holds no secrets; the bundle leaves here
  # unsigned.
  build-mas:
    strategy:
      matrix:
        os: ["macos-15"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    outputs:
      artifact_version: ${{ steps.mode.outputs.artifact_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          submodules: recursive
          # The version comes from git describe: full history and tags.
          fetch-depth: 0

      - name: Check Entitlements
        run: scripts/check_entitlements.sh

      - name: Resolve Build Mode
        id: mode
        env:
          BUILD_MODE_INPUT: ${{ github.event.inputs.build_mode }}
        run: scripts/ci/build_mode.sh >> "$GITHUB_OUTPUT"

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: mas-${{ github.job }}-${{ matrix.os }}-${{ env.BUILD_TYPE }}

      - name: Install Qt6
        uses: ./.github/actions/install-qt6

      - name: Install Dependence
        run: brew install --formula automake texinfo libarchive googletest libsodium

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            rust -> build/cargo
          shared-key: rust-mas-${{ runner.os }}-${{ matrix.os }}-${{ env.BUILD_TYPE }}
          cache-on-failure: true

      - name: Build GpgFrontend
        env:
          GPGFRONTEND_BUILD_MODE: ${{ steps.mode.outputs.gpgfrontend_build_mode }}
        run: scripts/ci/macos/build.sh --flavor sandbox

      # The same four checks the Developer ID bundle gets, from the same
      # script. A macOS descriptor authenticates module metadata and build
      # identity; Apple authenticates the executable code and enforces it at
      # load time, as it does for every other Mach-O in the bundle.
      - name: Assemble The Bundle
        run: scripts/ci/macos/assemble_bundle.sh --app-store

      - name: Stage Unsigned Payload
        run: scripts/ci/macos/stage_unsigned.sh

      - name: Upload Unsigned Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # NOT "gpgfrontend-*": that is the pattern release jobs download, and
          # an unsigned bundle must never reach a release.
          name: unsigned-mas-app-${{ matrix.os }}
          path: ${{ github.workspace }}/build/unsigned/GpgFrontend.app.zip
          if-no-files-found: error
          retention-days: 5

  sign-mas:
    needs: build-mas
    # Two independent gates on which refs may ever request the signing
    # material: this condition, and the deployment branch rule on the
    # environment.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    uses: ./.github/workflows/sign-apple.yml
    with:
      target: app-store
      runners: '["macos-15"]'
      artifact_version: ${{ needs.build-mas.outputs.artifact_version }}
    # Named one by one, never inherited: this target's credentials only. A
    # secret set in the `mas-signing` environment wins over the same name
    # passed here, so either place works.
    secrets:
      MAS_APPLICATION_CERT: ${{ secrets.MAS_APPLICATION_CERT }}
      MAS_APPLICATION_CERT_PWD: ${{ secrets.MAS_APPLICATION_CERT_PWD }}
      MAS_APPLICATION_CODE_SIGN_IDENTITY: ${{ secrets.MAS_APPLICATION_CODE_SIGN_IDENTITY }}
      MAS_INSTALLER_CERT: ${{ secrets.MAS_INSTALLER_CERT }}
      MAS_INSTALLER_CERT_PWD: ${{ secrets.MAS_INSTALLER_CERT_PWD }}
      MAS_INSTALLER_CODE_SIGN_IDENTITY: ${{ secrets.MAS_INSTALLER_CODE_SIGN_IDENTITY }}
      MAS_PROVISIONING_PROFILE_DATA: ${{ secrets.MAS_PROVISIONING_PROFILE_DATA }}
