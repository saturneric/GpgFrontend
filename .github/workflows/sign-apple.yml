#
# Apple signing, shared by the Developer ID release (build.yml, sign-macos)
# and the App Store package (mas-sandbox.yml, sign-mas).
#
# Trust boundary
# --------------
# The build jobs compile and deploy the bundle and never see a secret; this
# job holds the Apple credentials and runs nothing but Apple's own tools and
# the signing scripts on the finished bundle. That keeps the private keys off
# any runner that also executes build-time code -- submodules, cargo build
# scripts, brew formulas and third-party build actions.
#
# The build job is treated as potentially compromised, so what it hands over
# is untrusted bytes. This job may unpack, inspect and sign that payload; it
# must never source, evaluate, execute, or take configuration or signing
# policy from it. Signing identity, entitlement policy, signing order and
# acceptance checks come from this commit of the repository instead: a sparse
# checkout of scripts/ci/apple and resource/entitlements, without submodules,
# LFS or a stored token -- the same commit this workflow file is read from.
#
# What this does NOT do is establish provenance: a compromised build job can
# still present a malicious payload that this job faithfully signs. Isolating
# the key is the goal here; attestation is a separate problem.
#
# Secrets come from the target's GitHub environment, or from the caller, which
# names only this target's secrets (a reusable workflow sees no repository
# secret it is not handed). Nothing is inherited, so a Developer ID run cannot
# read an App Store secret or the other way round. Where both are set, the
# environment's value wins.
#
#   developer-id  `macos-signing` environment:
#     DEVELOP_ID_CERT / _PWD           base64 Developer ID .p12, its password
#     DEVELOPER_ID_CODE_SIGN_IDENTITY  the identity string codesign selects
#     ASC_API_KEY_P8                   contents of the App Store Connect .p8
#     ASC_KEY_ID / ASC_ISSUER_ID       its key id and issuer uuid
#
#   app-store     `mas-signing` environment:
#     MAS_APPLICATION_CERT / _PWD          base64 Apple Distribution .p12
#     MAS_APPLICATION_CODE_SIGN_IDENTITY   identity string codesign selects
#     MAS_INSTALLER_CERT / _PWD            base64 Mac Installer Distribution .p12
#     MAS_INSTALLER_CODE_SIGN_IDENTITY     identity string productbuild selects
#     MAS_PROVISIONING_PROFILE_DATA        base64 .provisionprofile
#
# Maintainer: configure the `macos-signing` environment's deployment branch
# rule to allow only `main`, `release/[0-9]*.[0-9]*` and tags matching
# `v[0-9]*.[0-9]*.[0-9]*`, and `mas-signing`'s only `main` and those tags, as
# defence in depth behind the callers' `if:` (which also refuse a prerelease
# tag, "-" in it, that the rule's pattern cannot tell apart).

name: Sign Apple Bundle

on:
  workflow_call:
    inputs:
      # developer-id: notarized, stapled disk image for direct download.
      # app-store:    sandboxed installer package for App Store Connect.
      target:
        type: string
        required: true
      # The runner labels to sign on, as a JSON list; each signs the bundle
      # its build leg uploaded as unsigned-<macos|mas>-app-<label>.
      runners:
        type: string
        required: true
      # The file-safe version (cmake/GitVersion.cmake) the output is named
      # after. It comes from the caller's own derivation from git, never from
      # a build artifact, and is checked to be a plain token before use.
      artifact_version:
        type: string
        required: true
    # Each caller passes only its own target's names; the job's environment
    # overrides any of them it also sets.
    secrets:
      DEVELOP_ID_CERT: { required: false }
      DEVELOP_ID_CERT_PWD: { required: false }
      DEVELOPER_ID_CODE_SIGN_IDENTITY: { required: false }
      ASC_API_KEY_P8: { required: false }
      ASC_KEY_ID: { required: false }
      ASC_ISSUER_ID: { required: false }
      MAS_APPLICATION_CERT: { required: false }
      MAS_APPLICATION_CERT_PWD: { required: false }
      MAS_APPLICATION_CODE_SIGN_IDENTITY: { required: false }
      MAS_INSTALLER_CERT: { required: false }
      MAS_INSTALLER_CERT_PWD: { required: false }
      MAS_INSTALLER_CODE_SIGN_IDENTITY: { required: false }
      MAS_PROVISIONING_PROFILE_DATA: { required: false }

permissions:
  contents: read

jobs:
  sign:
    name: sign (${{ matrix.os }})
    strategy:
      # One leg failing does not cancel the others: a cancelled leg hides
      # whether it would have failed too (build.yml's matrices alike).
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    environment: ${{ inputs.target == 'app-store' && 'mas-signing' || 'macos-signing' }}
    env:
      TARGET: ${{ inputs.target }}
      ENTITLEMENTS: resource/entitlements/${{ inputs.target == 'app-store' && 'Sandbox' || 'Normal' }}.entitlements
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/apple
            resource/entitlements

      # Before the download and the signing pass, so a half-configured
      # environment costs seconds.
      - name: Preflight Check Signing Credentials
        env:
          DEVELOP_ID_CERT: ${{ secrets.DEVELOP_ID_CERT }}
          DEVELOP_ID_CERT_PWD: ${{ secrets.DEVELOP_ID_CERT_PWD }}
          DEVELOPER_ID_CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MAS_APPLICATION_CERT: ${{ secrets.MAS_APPLICATION_CERT }}
          MAS_APPLICATION_CERT_PWD: ${{ secrets.MAS_APPLICATION_CERT_PWD }}
          MAS_APPLICATION_CODE_SIGN_IDENTITY: ${{ secrets.MAS_APPLICATION_CODE_SIGN_IDENTITY }}
          MAS_INSTALLER_CERT: ${{ secrets.MAS_INSTALLER_CERT }}
          MAS_INSTALLER_CERT_PWD: ${{ secrets.MAS_INSTALLER_CERT_PWD }}
          MAS_INSTALLER_CODE_SIGN_IDENTITY: ${{ secrets.MAS_INSTALLER_CODE_SIGN_IDENTITY }}
          MAS_PROVISIONING_PROFILE_DATA: ${{ secrets.MAS_PROVISIONING_PROFILE_DATA }}
        run: scripts/ci/apple/preflight.sh "$TARGET"

      # Every name and path this job uses comes from GitHub context and runner
      # variables, never from the downloaded artifact: that would let the build
      # side steer the privileged job.
      - name: Resolve Artifact Metadata
        id: meta
        env:
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_VERSION" =~ ^[0-9A-Za-z.-]+$ ]] || {
            echo "::error::artifact_version is not a plain token" >&2
            exit 1
          }
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "APP=$RUNNER_TEMP/app/GpgFrontend.app" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/upload-artifact" >> "$GITHUB_ENV"

      - name: Download Unsigned Bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.target == 'app-store' && 'unsigned-mas-app' || 'unsigned-macos-app' }}-${{ matrix.os }}
          path: ${{ runner.temp }}/unsigned

      - name: Unpack Unsigned Bundle
        run: |
          ditto -x -k "$RUNNER_TEMP/unsigned/GpgFrontend.app.zip" "$RUNNER_TEMP/app"
          test -d "$APP"

      - name: Prepare Signing Keychain
        env:
          APP_CERT: ${{ inputs.target == 'app-store' && secrets.MAS_APPLICATION_CERT || secrets.DEVELOP_ID_CERT }}
          APP_CERT_PWD: ${{ inputs.target == 'app-store' && secrets.MAS_APPLICATION_CERT_PWD || secrets.DEVELOP_ID_CERT_PWD }}
          INSTALLER_CERT: ${{ inputs.target == 'app-store' && secrets.MAS_INSTALLER_CERT || '' }}
          INSTALLER_CERT_PWD: ${{ inputs.target == 'app-store' && secrets.MAS_INSTALLER_CERT_PWD || '' }}
        run: scripts/ci/apple/keychain.sh create

      - name: Embed Provisioning Profile
        if: inputs.target == 'app-store'
        env:
          MAS_PROVISIONING_PROFILE_DATA: ${{ secrets.MAS_PROVISIONING_PROFILE_DATA }}
        run: scripts/ci/apple/make_pkg.sh embed-profile "$APP"

      - name: Sign Application
        env:
          IDENTITY: ${{ inputs.target == 'app-store' && secrets.MAS_APPLICATION_CODE_SIGN_IDENTITY || secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY }}
        run: |
          scripts/ci/apple/sign_bundle.sh "$APP" "$ENTITLEMENTS"
          scripts/ci/apple/verify_signature.sh "$TARGET" "$APP" "$ENTITLEMENTS"

      # The .app is stapled too, though the dmg is the only deliverable: the
      # ticket travels inside the dmg, and once a user drags the app to
      # /Applications the dmg's own staple no longer covers it.
      - name: Notarize And Staple Application
        if: inputs.target == 'developer-id'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
          scripts/ci/apple/notarize.sh "$RUNNER_TEMP/notarize-app.zip" "$APP"
          rm -f "$RUNNER_TEMP/notarize-app.zip"

      # Named like every other download, with no architecture: the runner
      # label (macos-15, macos-15-intel) already tells the images apart.
      - name: Build Notarize And Staple Disk Image
        if: inputs.target == 'developer-id'
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_CODE_SIGN_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DMG_NAME: GpgFrontend-${{ steps.meta.outputs.artifact_version }}-${{ matrix.os }}.dmg
        run: |
          scripts/ci/apple/make_dmg.sh "$APP" "$RUNNER_TEMP/unsigned" "$OUT/$DMG_NAME"
          scripts/ci/apple/notarize.sh "$OUT/$DMG_NAME"

          # The acceptance test: what macOS itself decides about the finished
          # deliverables. --type execute is the assessment made when the app
          # is launched; --type open with the primary-signature context is
          # what Finder does when the downloaded disk image is mounted.
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$OUT/$DMG_NAME"

      - name: Build And Verify Installer Package
        if: inputs.target == 'app-store'
        env:
          INSTALLER_IDENTITY: ${{ secrets.MAS_INSTALLER_CODE_SIGN_IDENTITY }}
          PKG_NAME: GpgFrontend-${{ steps.meta.outputs.artifact_version }}-${{ matrix.os }}-sandbox.pkg
        run: scripts/ci/apple/make_pkg.sh package "$APP" "$OUT/$PKG_NAME"

      # The Developer ID dmg is a release deliverable: provenance collects
      # every `gpgfrontend-*` artifact of a build.yml run and pairs it with
      # the `buildinfo-*` of the same leg.
      - name: Upload Disk Image
        if: inputs.target == 'developer-id'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpgfrontend-${{ matrix.os }}-installed
          path: ${{ runner.temp }}/upload-artifact/*
          if-no-files-found: error

      # NOT "gpgfrontend-*": the App Store package goes to App Store Connect by
      # hand and is never a release download.
      - name: Upload Installer Package
        if: inputs.target == 'app-store'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-pkg-${{ matrix.os }}-${{ steps.meta.outputs.artifact_version }}
          path: ${{ runner.temp }}/upload-artifact/*
          if-no-files-found: error

      # Fires on cancellation too, so cancelling a run mid-signing still
      # removes the temporary keychain and every credential file.
      - name: Clean Up Signing Material
        if: always()
        run: scripts/ci/apple/keychain.sh delete
