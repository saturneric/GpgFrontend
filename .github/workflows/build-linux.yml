#
# The Linux AppImages, one leg per runner and flavour, called by build.yml's
# build-linux job. It holds no secrets and uploads exactly
# gpgfrontend-<leg> and buildinfo-<leg> per leg, as provenance expects.

name: Build Linux

on:
  workflow_call:
    inputs:
      # The CMake build type.
      build_type:
        type: string
        required: true
      # GPGFRONTEND_BUILD_MODE: release or nightly.
      gpgfrontend_build_mode:
        type: string
        required: true
      # The file-safe version the artifacts are named after.
      artifact_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04-arm"]
        flavor: ["installed", "portable"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Lets ccache cache every translation unit that force-includes the CMake
      # PCH, and the .gch itself. Without these they were all "uncacheable"
      # -- 493 of 824 compiler calls on Linux -- so even a warm cache rebuilt
      # core, ui and test in full. Only timestamp and __DATE__-style checks
      # are relaxed; what is hashed into an object is unchanged.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      BUILD_TYPE: ${{ inputs.build_type }}
      GPGFRONTEND_BUILD_MODE: ${{ inputs.gpgfrontend_build_mode }}
      ARTIFACT_VERSION: ${{ inputs.artifact_version }}
      FLAVOR: ${{ matrix.flavor }}
      # "installed" is the default flavour, so only "portable" is spelled out
      # in artifact names.
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'portable' && '-portable' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: "false"
          submodules: recursive
          # The version comes from git describe: full history and tags.
          fetch-depth: 0

      # One compiler cache per runner, shared by both flavours: the portable
      # flag reaches a single translation unit (BuildInfoUtils.cpp), not the
      # PCH, so the two builds are otherwise object-for-object identical. The
      # installed leg is the only writer; the portable leg only reads it.
      # Nothing is saved from pull requests, so a cache main restores can only
      # have been written by a push to it. The key keeps the `build-` prefix
      # these legs had as one job, so the split costs no cold build.
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: build-${{ matrix.os }}-installed-${{ env.BUILD_TYPE }}
          # A limit, not a size: ccache caps each of its 16 subdirectories at
          # 1/16 of this, and a compressed .gch runs past 100 MB -- at 1500M
          # every PCH result was evicted as it was stored.
          max-size: 4G
          save: ${{ github.event_name == 'push' && matrix.flavor == 'installed' }}

      # Everything compiled from here on touches the cache entries it uses, so
      # "older than this mark" is exactly "not used by this build". The build
      # script evicts those before the post step saves the cache.
      - name: Mark ccache Epoch
        run: echo "CCACHE_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Dependence
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential binutils git autoconf automake gettext texinfo
          sudo apt-get -y install gcc g++ ninja-build
          sudo apt-get -y install libarchive-dev libssl-dev libsodium-dev
          sudo apt-get -y install gpgsm libxcb-xinerama0 libxcb-icccm4-dev libcups2-dev libdrm-dev libegl1-mesa-dev
          sudo apt-get -y install libfuse2 libgcrypt20-dev libnss3-dev libpci-dev libpulse-dev libudev-dev libxtst-dev
          sudo apt-get -y install libglu1-mesa-dev libfontconfig1-dev libx11-xcb-dev libxcb-image0 gyp
          sudo apt-get -y install libxcb-* libxkbcommon-x11-0 libwayland-cursor0 libwayland-egl1
          # libsecret is dlopen'd, never linked. Installed only so the AppImage
          # can carry a copy built against the same glib it bundles.
          sudo apt-get -y install libsecret-1-0

      - name: Install Qt6
        uses: ./.github/actions/install-qt6

      - name: Install Rust
        id: rust
        # Pinned to a SHA, so the @stable ref name no longer selects the
        # toolchain; say it explicitly instead.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      # Corrosion's target dir, restored whole. rust-cache is not used: cargo
      # builds with --target <triple>, and rust-cache's cleaner took
      # <target-dir>/<triple> for a profile directory and deleted release/
      # inside it, so every leg compiled all ~196 crates from nothing while
      # reporting an exact cache hit.
      #
      # The key is everything that decides the dependency artifacts: the
      # runner, the exact rustc, the profile and Cargo.lock. Both flavours
      # share it -- the crate never sees the portable flag -- and the
      # installed leg alone saves it, right after a successful build.
      - name: Restore Cargo Cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/cargo
          key: cargo-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.BUILD_TYPE }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ env.BUILD_TYPE }}-

      - name: Build GpgFrontend
        run: scripts/ci/linux/build.sh

      - name: Save Cargo Cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/build/cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
        if: >-
          github.event_name == 'push' && matrix.flavor == 'installed' &&
          steps.cargo-cache.outputs.cache-hit != 'true'

      - name: Package The AppImage
        run: scripts/ci/linux/package.sh

      - name: Smoke Test The AppImage
        run: scripts/ci/linux/smoke_appimage.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpgfrontend-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ github.workspace }}/build/upload-artifact/GpgFrontend-*.AppImage*
          if-no-files-found: error

      - name: Upload Build Info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildinfo-${{ matrix.os }}-${{ matrix.flavor }}
          path: ${{ github.workspace }}/build/artifacts/build-info.json
          if-no-files-found: error
