# Release-line policy: which series exist, what state each is in, and which
# versions are withdrawn. The one place this is decided; SECURITY.md's table,
# the signed update index and the CI order check are all read from here.
# Check with: python3 scripts/release/policy.py check
#
# status:
#   mainline  the series under development on main; no final X.Y.0 yet
#             (its builds are nightlies). At most one.
#   stable    a series cut from main that still gets fixes on release/X.Y:
#             its releases are the stable channel. Several may be stable at
#             once (an older one keeps its fixes for a while); a stable
#             series is never sent anywhere, whatever successor it names.
#             Until its X.Y.0 is out, the index lists it as a prerelease,
#             with its newest release candidate (vX.Y.0-rc.N) as one.
#             Builds of release/X.Y (of a stable or the mainline series) are
#             that series' beta, offered to users who opt in.
#   legacy    an older series that still gets security fixes until `eol`.
#             Its users are offered the series its successor chain ends at.
#   eol       no fixes, and nothing from its own branch. Its users are
#             offered the series its `successor` chain ends at.
#
# A successor chain (legacy or eol series to their successors, on through
# those that are legacy or eol themselves) must end at a stable series.
# Clients before 2.2.5 follow one step only: point each successor at a
# stable series directly where possible (policy.py check warns otherwise).
#
# When X.Y.0-rc.1 is tagged (or X.Y.0, without a candidate): X.Y becomes
# stable and X.(Y+1) is added as mainline, in the same PR that cuts
# release/X.Y (scripts/release/cut.sh). The series before becomes legacy
# (with an eol date and a successor) when its fixes are to stop; until then
# it stays stable beside X.Y.
#
# platforms: the oldest system a series' builds run on. Required for the
# series users can be sent to (mainline and stable): an update or a successor
# is only offered to a system that meets it. Keys: windows (NT version),
# macos, linux_glibc, android_api.

schema = 1

[signing]
# The first release whose files are signed with a key the trust root pins
# (release/root/, host_policy.stable_pgp). Older ones were signed with keys no longer pinned and
# stay on GitHub only; from this version on, releases made before the update
# index are brought into it with `gfrelease import`, on their original
# signatures. Every release must carry the signatures its kind requires.
legacy_unsigned_before = "2.1.5"

[series."2.3"]
status = "mainline"
branch = "main"

[series."2.3".platforms]
windows = "10.0.17763"
macos = "15.0"
linux_glibc = "2.35"
android_api = 28

[series."2.2"]
status = "stable"
branch = "release/2.2"

[series."2.2".platforms]
windows = "10.0.17763"
macos = "15.0"
linux_glibc = "2.35"
android_api = 28

[series."2.1"]
status = "legacy"
branch = "release/2.1"
eol = "2027-12-31"
successor = "2.2"
note = "the last series that builds with Qt5"

[series."2.0"]
status = "eol"
successor = "2.2"

[series."1"]
status = "eol"
successor = "2.2"
