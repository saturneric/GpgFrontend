[package]
name = "gf-rust"
# Not bumped: the engine reports the Host's version (CMake passes it in as
# GFR_ENGINE_VERSION, see ENGINE_VERSION in src/ffi/mod.rs). This one is only
# the fallback for a plain cargo build.
version = "0.3.2"
edition = "2024"
description = "Rust Engine for GpgFrontend"
authors = ["saturneric <eric@bktus.com>"]
license = "GPL-3.0-or-later"

[lib]
name = "gf_rust"
crate-type = ["staticlib"]

[dependencies]
# The key package v3 container (src/keypack): XChaCha20-Poly1305 parts,
# a CBOR (RFC 8949) header and key metadata, Argon2id for the PIN, BLAKE2b
# for the random wrap secret.
argon2 = "0.5.3"
blake2 = "0.10.6"
chacha20poly1305 = "0.10.1"
ciborium = "0.2.2"
hex = "0.4.3"
serde_bytes = "0.11"
sha2 = "0.10.9"
anyhow = "1.0.102"
env_logger = "0.11.10"
log = "0.4.29"
once_cell = "1.21.4"
pgp = { version = "0.21.1", features = ["pqc"] }
rand = "0.8"
rsa = "0.9.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4.46"
tempfile = "3.27.0"
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { "version" = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
] }

[build-dependencies]
cbindgen = "0.29.2"

# Both are already in Cargo.lock as transitive dependencies of `pgp`, so they
# cost no additional download and no additional compilation unit.
#   flate2 -- build genuine deflate/zlib payloads for the RFC 9580 §5.6
#             compression-bomb and nesting-cap tests.
# (`hex`, used to decode the RFC 9580 Appendix A known-answer vectors, is a
# regular dependency now.)
[dev-dependencies]
flate2 = "1.1"

# Compile dependencies with optimisations even in the unoptimised profiles.
# The test suite is dominated by cryptography that lives entirely in
# dependencies (rsa, argon2, sha2, ml-dsa, the pgp crate itself); in debug
# those run 20-100x slower, which is the difference between a ~1 minute and a
# >10 minute `cargo test`. Our own crate stays unoptimised so backtraces and
# debug-assertions remain useful, and the release profile is untouched.
# Dependencies keep line tables only: optimised code can't be stepped with
# locals anyway, and their full debuginfo was ~80% of every debug artifact.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 3
debug = "line-tables-only"
