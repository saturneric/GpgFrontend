[package]
name = "gf-rust"
version = "0.2.1"
edition = "2024"
description = "Rust Engine for GpgFrontend"
authors = ["saturneric <eric@bktus.com>"]
license = "GPL-3.0-or-later"

[lib]
name = "gf_rust"
crate-type = ["staticlib"]

[dependencies]
anyhow = "1.0.102"
env_logger = "0.11.10"
log = "0.4.29"
once_cell = "1.21.4"
pgp = { version = "0.20.0", features = ["draft-pqc"] }
rand = "0.8"
rsa = "0.9.10"
tar = "0.4.45"
tempfile = "3.27.0"
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { "version" = "0.61.2", features = ["Win32_System_Memory"] }

[build-dependencies]
cbindgen = "0.29.2"

# Both are already in Cargo.lock as transitive dependencies of `pgp`, so they
# cost no additional download and no additional compilation unit.
#   flate2 -- build genuine deflate/zlib payloads for the RFC 9580 §5.6
#             compression-bomb and nesting-cap tests.
#   hex    -- decode the hex-literal known-answer vectors from RFC 9580
#             Appendix A without hand-rolling a parser.
[dev-dependencies]
flate2 = "1.1"
hex = "0.4"

# Compile dependencies with optimisations even in the unoptimised profiles.
# The test suite is dominated by cryptography that lives entirely in
# dependencies (rsa, argon2, sha2, ml-dsa, the pgp crate itself); in debug
# those run 20-100x slower, which is the difference between a ~1 minute and a
# >10 minute `cargo test`. Our own crate stays unoptimised so backtraces and
# debug-assertions remain useful, and the release profile is untouched.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
