# git-cliff configuration: the first draft of a release's notes, from the
# Conventional Commits since the previous release. scripts/release/notes.sh
# writes it to release/notes/<version>.md, which is then edited by hand and
# reviewed in a PR before the release is tagged. The published notes are that
# file, never this tool's raw output.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Only real releases bound a range: never base tags (vX.Y.0-alpha.0) nor the
# moving `nightly`.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^(doc|docs)", group = "<!-- 4 -->Documentation" },
  { message = "^(i18n|l10n)", group = "<!-- 5 -->Translations" },
  { message = "^revert", group = "<!-- 6 -->Reverted" },
  # What users never see stays out of the draft.
  { message = "^(chore|ci|test|build|style)", skip = true },
]
